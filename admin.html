<!--
  A diferencia de index.html (donde el manifest se cambia con JavaScript
  según el #hash de la URL — algo que el iPhone no siempre respeta al
  usar "Agregar a pantalla de inicio"), esta página tiene su PROPIO
  manifest escrito aquí mismo, tal cual, desde el primer momento. Por eso
  es la página que hay que abrir para agregar el ícono de Admin, en vez
  de abrir zano-five.vercel.app/#admin directamente.
-->
<link rel="manifest" href="/manifest-admin.json">
<meta http-equiv="refresh" content="0; url=/#admin">
<title>ZANO Admin</title>
<style>html, body { margin: 0; height: 100%; background: #FAF8F3; }</style>
<script>location.replace('/#admin');</script>
</head>
