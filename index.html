<script>
  // Si entras directo a /#admin o /#staff y desde ahí usas "Compartir ->
  // Agregar a pantalla de inicio", el teléfono NO usa la URL que ves en la
  // barra de direcciones para decidir a dónde abrir el ícono nuevo — usa el
  // "start_url" que diga el manifest.json cargado en ese momento. Por eso
  // antes, sin importar desde cuál pantalla lo agregaras, el ícono siempre
  // terminaba abriendo como si fueras un cliente (start_url "/" del
  // manifest normal). Este script cambia el manifest ANTES de que exista
  // oportunidad de tocar "Agregar a inicio", para que cada ícono recuerde
  // a dónde debe abrir.
  (function () {
    var hash = window.location.hash;
    var link = document.getElementById('manifest-link');
    if (!link) return;
    if (hash === '#admin') link.href = '/manifest-admin.json';
    else if (hash === '#staff') link.href = '/manifest-staff.json';
  })();
</script>

<style>
  :root {
    --bg: #FAF8F3;
    --card: #FFFFFF;
    --border: #E7E2D6;
    --text: #1F2420;
    --muted: #6B7268;
    --accent: #E2703A;
    --green: #2B5D3F;
    --green-tint: #E4ECE1;
    --chip: #F0ECE0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overscroll-behavior: none; }
  body {
    font-family: 'Work Sans', sans-serif;
    background: #EDE7D8;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 0;
    position: fixed;
    inset: 0;
    width: 100%;
    overflow: hidden;
  }
  a { text-decoration: none; color: inherit; }
  button { font: inherit; border: none; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  h1, p, span, div { -webkit-font-smoothing: antialiased; }
  #phone {
    width: 390px;
    height: 844px;
    max-height: 100dvh;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    border-radius: 36px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    touch-action: pan-y;
  }
  @media (max-width: 600px) {
    /* En el teléfono real, body ya no debe verse nunca (el #phone ocupa
       toda la pantalla) — pero por si algún navegador deja un pixelito
       sin cubrir en la zona del home indicator, que sea del mismo color
       que el fondo de la app y no se note como una línea aparte. "html"
       se pone del mismo color por la misma razón: en modo standalone
       (agregada a pantalla de inicio) algunos navegadores pintan esa
       orilla con el fondo de <html>, no el de <body>. */
    html { background: var(--bg); }
    body { padding: 0; background: var(--bg); }
    #phone {
      width: 100vw;
      height: 100dvh;
      /* "max-height: none" cancela a propósito el "max-height: 100dvh" que
         #phone trae desde la regla de escritorio (más arriba) — sin
         repetirlo aquí, ese límite viejo seguía aplicando igual. Y era
         justo ese límite el que le ganaba al alto real en píxeles que le
         da el JavaScript (ajustarAltoReal, más abajo) — en el iPhone real,
         sobre todo agregado a pantalla de inicio, ese alto real puede ser
         MÁS GRANDE que lo que "100dvh" calcula. Si dejábamos el límite
         viejo, #phone se quedaba más chico de lo que debía y dejaba un
         hueco en blanco abajo pegado a la barra de navegación, como si la
         barra se viera "más gruesa" de lo que en realidad es. */
      max-height: none;
      border-radius: 0;
      box-shadow: none;
    }
  }
  #content {
    position: absolute;
    top: 0; left: 0; right: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
    box-sizing: border-box;
    /* El "env(safe-area-inset-top)" es indispensable aquí: como la barra de
       estado del iPhone se pidió "black-translucent" (para que se vea
       bonita, transparente sobre la app), el contenido se dibuja POR
       DEBAJO de ella por defecto — y si no le dejamos ese espacio propio,
       el reloj/batería tapan el texto de arriba, sobre todo abierta como
       ícono instalado (modo standalone), que es donde más se nota. */
    padding: calc(28px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  #nav {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    /* El "36px" es lo que de verdad se puede achicar (íconos + texto +
       aire). El "env(safe-area-inset-bottom)" se redujo otro 1/4 más
       (ahora queda al 56.25% de lo real, era 75%) A PROPÓSITO Y A
       SABIENDAS del riesgo: mientras menos franja se deja, más se meten
       los íconos dentro de la zona real del gesto de "ir a inicio" del
       iPhone — con esta reducción quedan unos 15px dentro de esa zona
       (más que antes). Se dejó así porque así se pidió explícitamente,
       aceptando ese riesgo. Esa franja es del mismo blanco que el resto
       de la barra (y que el fondo de la página, ver más abajo en el JS),
       así que todo se ve como un solo bloque blanco. */
    height: calc(36px + (env(safe-area-inset-bottom, 0px) * 0.5625));
    background: #FFFFFF;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) * 0.5625);
    box-sizing: border-box;
  }
  @media (max-width: 600px) {
    /* La barra de navegación ya NO cuelga del borde de abajo de #phone
       (que a veces mide un poco corto o largo de más en el celular real).
       Aquí, en vez, se fija directo al borde real de LA PANTALLA
       (position:fixed usa la ventana completa, no #phone) — así siempre
       toca el fondo de verdad, sin depender de que el cálculo de alto sea
       exacto. Si queda un huequito entre el contenido y la barra, ahí se
       alcanza a ver el crema de fondo de #phone/body (que es a propósito
       el mismo color que toda la app), en vez de un espacio en blanco.
       Esta regla va DESPUÉS de la de arriba a propósito: como las dos
       tienen la misma "fuerza" (mismo selector #nav), en CSS gana la que
       esté más abajo en el archivo — ponerla antes no funcionaba. */
    #nav {
      position: fixed;
    }
  }
  /* Antes había aquí un "colchón" extra (un bloque blanco de 40px pegado
     debajo de la barra) para tapar una rendija que a veces aparecía por
     un cálculo de alto de pantalla un poquito chico en Safari. Pero ese
     bloque de 40px se veía y hacía que la barra completa se sintiera muy
     gruesa. Ese mismo problema ya se resuelve abajo en JS (pintamos el
     fondo de toda la página del mismo blanco de la barra mientras se ve
     la barra), así que aquí solo dejamos un colchón mínimo, casi
     invisible, nada más por seguridad. */
  #nav::after {
    content: '';
    position: absolute;
    left: 0; right: 0; top: 100%;
    height: 2px;
    background: #FFFFFF;
  }
  /* Los íconos/texto de la barra estaban centrados solo dentro de la
     parte de arriba (36px), dejando toda la franja reservada vacía
     debajo, sin usar. Este "transform" los recorre hacia abajo la mitad
     de esa franja, para que queden centrados en medio de TODA la barra
     (36px + franja), no solo en la parte de arriba. En la Mac no se
     nota nada (ahí la franja mide 0px). En el iPhone real, esto los
     acerca aún más a la zona del gesto de inicio — ya se sabe y se
     acepta el riesgo, pedido a propósito. */
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; color: #9AA096; transform: translateY(calc(env(safe-area-inset-bottom, 0px) * 0.5625 / 2)); }
  .nav-item.active { color: var(--green); }
  .nav-item span { font-size: 10px; font-weight: 600; line-height: 1; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; }
  .muted { color: var(--muted); }
  .pill-btn { width: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: var(--accent); color: #FFFFFF; border-radius: 14px; padding: 16px; font-size: 15px; font-weight: 700; }
  .chip-btn { display: flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--border); background: #FFFFFF; font-size: 12.5px; font-weight: 600; color: var(--text); }
  .chip-btn.selected { border-color: var(--green); background: var(--green-tint); color: var(--green); }
  .macro-tile { background: #FFFFFF; border: 1px solid var(--border); border-radius: 12px; padding: 10px 6px; text-align: center; }
  .macro-tile .val { font-size: 15px; font-weight: 700; color: var(--green); }
  .macro-tile .lbl { font-size: 10px; color: var(--muted); margin-top: 2px; }
  input[type="text"], input[type="email"], input[type="password"], input[type="number"], select, textarea {
    width: 100%;
    box-sizing: border-box;
    font-family: 'Work Sans', sans-serif;
    font-size: 14px;
    color: var(--text);
    padding: 13px 14px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: #FFFFFF;
    outline: none;
  }
  textarea { resize: vertical; min-height: 90px; }
  input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus, input[type="number"]:focus, select:focus, textarea:focus {
    border-color: var(--green);
  }
  .admin-tab { flex: 1; text-align: center; padding: 10px 4px; border-radius: 11px; font-size: 11.5px; font-weight: 700; }
  .admin-tab.active { background: var(--green); color: #FFFFFF; }
  .admin-tab:not(.active) { color: var(--muted); }
  .admin-stat { background: #FFFFFF; border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
  .admin-stat .val { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600; color: var(--text); }
  .admin-stat .lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .admin-table-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid #F0ECE0; }
  .admin-table-row:last-child { border-bottom: none; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #D8D2C2; border-radius: 999px; }
</style>
</head>

   ZANO — App de pedidos (standalone build)
   Reconstrucción como app web independiente (sin dependencias de build),

   ========================================================================= */

// ---------------------------------------------------------------------
// Alto real de la pantalla (arregla el espacio grande que queda abajo
// del nav en iOS cuando la app ya está instalada / agregada a inicio).
//
// El CSS "100dvh" debería bastar, pero en modo standalone de iOS a veces
// no coincide con el alto que en realidad ve el usuario (sobre todo justo
// al abrir la app) y deja un hueco del color de fondo debajo de todo. Acá
// medimos el alto real con JavaScript (que si es confiable, viene de
// window.innerHeight / visualViewport) y se lo damos directo a #phone en
// vez de confiar solo en el CSS.
// ---------------------------------------------------------------------
function ajustarAltoReal() {
  const phone = document.getElementById('phone');
  if (!phone) return;
  const esMovil = window.matchMedia('(max-width: 600px)').matches;
  if (!esMovil) { phone.style.height = ''; return; }
  const alto = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  phone.style.height = alto + 'px';
}
window.addEventListener('resize', ajustarAltoReal);
window.addEventListener('orientationchange', () => setTimeout(ajustarAltoReal, 300));
window.addEventListener('pageshow', ajustarAltoReal);
if (window.visualViewport) window.visualViewport.addEventListener('resize', ajustarAltoReal);
ajustarAltoReal();
// En modo standalone el alto correcto a veces se estabiliza un instante
// después de abrir la app — reintentamos una vez más por si acaso.
setTimeout(ajustarAltoReal, 300);

  // Semana (weekStart) a la que pertenece el pedido cacheado en este
  // teléfono para mostrarlo sin conexión — ver saveOfflineSnapshot().
  offlineWeekStart: null
};

function setState(patch) {
  state = { ...state, ...patch };
  saveSession();
  saveOfflineSnapshot();
  saveAdminSession();
  saveStaffSession();
  render();
}

function parsePriceNum(str) {
  if (str == null) return null;
  const cleaned = String(str).replace(/[^0-9.]/g, '');
  if (!cleaned) return null;
  const n = parseFloat(cleaned);
  return isFinite(n) ? n : null;
}

function esc(str) {
  return String(str ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function fmtMoney(cents) {
  return '$' + ((cents || 0) / 100).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtWeekLabel(weekStart) {
  if (!weekStart) return '';
  const [y, m, d] = weekStart.split('-').map(Number);
  const monday = new Date(y, m - 1, d);
  const sunday = new Date(y, m - 1, d + 6);
  const opts = { day: 'numeric', month: 'short' };
  return monday.toLocaleDateString('es-MX', opts) + ' – ' + sunday.toLocaleDateString('es-MX', opts);
}

// ---------------------------------------------------------------------
// Cálculos derivados (equivalentes a renderVals() del prototipo)
// ---------------------------------------------------------------------
function computeIngredientRows() {
  return INGREDIENTES.map((ing) => {
    const isSelected = !!state.ingredients[ing.key];
    return { ...ing, isSelected };
  });
}

function computePokeIngredientTotal() {
  return POKE_SERVICE_FEE + INGREDIENTES.reduce((sum, ing) => sum + (state.ingredients[ing.key] ? ing.price : 0), 0);
}

function computePokeMacros() {
  return INGREDIENTES.reduce((acc, ing) => {
    if (!state.ingredients[ing.key]) return acc;
    return {
      protein: acc.protein + ing.protein,
      carbs: acc.carbs + ing.carbs,
      fat: acc.fat + ing.fat,
      fiber: acc.fiber + ing.fiber,
      weight: acc.weight + ing.weight
    };
  }, { ...POKE_BASE });
}

function isPokeSelected() {
  return !!state.selected && state.selected.name === 'Poke';
}

function computeSelectedPriceLabel() {
  const selected = state.selected;
  if (!selected) return '';
  if (isPokeSelected()) {
    return '$' + (computePokeIngredientTotal() * state.qty).toFixed(2);
  }
  const unitNum = parsePriceNum(selected.price);
  return unitNum != null ? ('$' + (unitNum * state.qty).toFixed(2)) : selected.price;
}

function computeDiasConPedido() {
  return DIAS.map((dia) => {
    const item = state.weekOrder[dia] || null;
    return {
      dia,
      item,
      label: item ? item.name : 'Elegir platillo',
      price: item ? item.price : '',
      hasItem: !!item
    };
  });
}

function computeWeekTotalLabel(diasConPedido) {
  const diasParaTotal = diasConPedido.filter((d) => d.hasItem);
  if (diasParaTotal.length === 0) return '$0.00';
  const precios = diasParaTotal.map((d) => parsePriceNum(d.price));
  const faltante = precios.some((n) => n === null);
  const total = precios.reduce((sum, n) => sum + (n || 0), 0);
  return faltante ? ('$' + total.toFixed(2) + '+') : ('$' + total.toFixed(2));
}

// Versión numérica del total (para cobrar) — "complete" indica que TODOS los
// platillos del pedido tienen precio real (ninguno quedó en '[PRECIO]').
function computeWeekTotalNumber(diasConPedido) {
  const diasParaTotal = diasConPedido.filter((d) => d.hasItem);
  if (diasParaTotal.length === 0) return { total: 0, complete: true };
  const precios = diasParaTotal.map((d) => parsePriceNum(d.price));
  const complete = precios.every((n) => n !== null);
  const total = precios.reduce((sum, n) => sum + (n || 0), 0);
  return { total, complete };
}

// Próxima recolección: si hoy (Lunes-Viernes) ya tiene pedido, es esa.
// Si no, busca el siguiente día de la semana que sí tenga pedido.
function computeProximaRecoleccion() {
  const jsDay = new Date().getDay(); // 0=Dom,1=Lun,...,6=Sáb
  const todayIndex = (jsDay >= 1 && jsDay <= 5) ? jsDay - 1 : null;
  const itemFor = (idx) => state.weekOrder[DIAS[idx]] || null;

  if (todayIndex !== null) {
    const hoy = itemFor(todayIndex);
    if (hoy) return { dia: DIAS[todayIndex], item: hoy, esHoy: true };
  }

  const start = todayIndex !== null ? todayIndex + 1 : 0;
  for (let i = start; i < DIAS.length; i++) {
    const item = itemFor(i);
    if (item) return { dia: DIAS[i], item, esHoy: false };
  }
  for (let i = 0; i < (todayIndex ?? DIAS.length); i++) {
    const item = itemFor(i);
    if (item) return { dia: DIAS[i], item, esHoy: false };
  }
  return null;
}

const API_BASE = ''; // mismo dominio que la app una vez desplegada en Vercel

async function apiFetch(path, options) {
  options = options || {};
  const res = await fetch(API_BASE + path, {
    method: options.method || 'GET',
    headers: Object.assign({ 'Content-Type': 'application/json' }, options.headers || {}),
    body: options.body ? JSON.stringify(options.body) : undefined
  });
  let data = null;
  try { data = await res.json(); } catch (e) { /* respuesta sin JSON (p.ej. backend no desplegado) */ }
  return { ok: res.ok, status: res.status, data: data };
}

// Guardado local en el teléfono (localStorage): NO es el backend, es solo
// para que la app recuerde tu sesión al volver a abrirla y pueda mostrar
// tu pedido aunque no haya internet en ese momento. Nunca se manda a

const SESSION_KEY = 'zano_session_v1';
const OFFLINE_CACHE_KEY = 'zano_offline_cache_v1';
const ADMIN_SESSION_KEY = 'zano_admin_session_v1';
const STAFF_SESSION_KEY = 'zano_staff_session_v1';

// Sesión de administrador y de cocina: se guardan aparte de la del cliente
// para que, al volver a abrir la app en ese mismo dispositivo, regrese
// directo a ese panel en vez de mandarte a la pantalla de login de cliente
// (que es lo que pasaba antes). "Salir" en cualquiera de los dos paneles
// borra su sesión guardada (ver setState, que llama a estas funciones).
function saveAdminSession() {
  try {
    if (state.adminToken) localStorage.setItem(ADMIN_SESSION_KEY, state.adminToken);
    else localStorage.removeItem(ADMIN_SESSION_KEY);
  } catch (e) { /* localStorage no disponible */ }
}
function loadAdminSession() {

}
function saveStaffSession() {

    if (state.staffToken) localStorage.setItem(STAFF_SESSION_KEY, state.staffToken);
    else localStorage.removeItem(STAFF_SESSION_KEY);
  } catch (e) { /* localStorage no disponible */ }
}
function loadStaffSession() {

}

function saveSession() {

// Guarda (o borra, si ya no aplica) una foto de tu pedido de esta semana
// para poder mostrarlo sin conexión la próxima vez que abras la app.
function saveOfflineSnapshot() {
  try {
    const hayPedido = state.user && DIAS.some((d) => state.weekOrder[d]);
    if (!hayPedido) {
      localStorage.removeItem(OFFLINE_CACHE_KEY);
      return;
    }
    localStorage.setItem(OFFLINE_CACHE_KEY, JSON.stringify({
      weekStart: computeWeekStartISO(),
      weekOrder: state.weekOrder,
      horarios: state.horarios,
      plantel: state.plantel || null
    }));
  } catch (e) { /* localStorage no disponible */ }
}

function loadOfflineSnapshot() {
  try {
    const raw = localStorage.getItem(OFFLINE_CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function computeWeekStartISO() {
  const d = new Date();
  const day = d.getDay(); // 0 domingo .. 6 sábado (hora local)
  const diff = (day === 0 ? -6 : 1) - day;
  const monday = new Date(d.getFullYear(), d.getMonth(), d.getDate() + diff);
  const yyyy = monday.getFullYear();
  const mm = String(monday.getMonth() + 1).padStart(2, '0');
  const dd = String(monday.getDate()).padStart(2, '0');
  return yyyy + '-' + mm + '-' + dd;
}

function guardarPedidoBackend(totalPesos) {
  if (!state.authToken) return; // sin sesión de backend -> no hay nada que guardar
  apiFetch('/api/order-save', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + state.authToken },
    body: {
      weekStart: computeWeekStartISO(),
      items: state.weekOrder,
      totalCents: Math.round((totalPesos || 0) * 100),
      horarios: state.horarios,
      plantel: state.plantel
    }
  }).catch(() => {});
}

// ---------------------------------------------------------------------
// Historial de pedidos ("Pedidos pasados" en Perfil, y "Pedir lo mismo
// que la semana pasada" en Inicio) — ambos usan la misma lista, que se
// trae del servidor con GET /api/order-save (ver ese archivo).
// ---------------------------------------------------------------------
async function loadOrderHistory() {
  if (!state.authToken) return;
  setState({ orderHistoryLoading: true });
  try {
    const r = await apiFetch('/api/order-save', {
      headers: { Authorization: 'Bearer ' + state.authToken }
    });
    if (r.ok && r.data && Array.isArray(r.data.history)) {
      setState({ orderHistoryLoading: false, orderHistoryLoaded: true, orderHistory: r.data.history });
    } else {
      setState({ orderHistoryLoading: false, orderHistoryLoaded: true });
    }
  } catch (e) {
    // Sin conexión: nos quedamos con lo que ya teníamos cargado (si algo), y
    // NO marcamos orderHistoryLoaded, para que se vuelva a intentar cuando
    // regrese la señal (en vez de quedarse vacío para siempre).
    setState({ orderHistoryLoading: false });
  }
}

// Recalcula el precio de un platillo guardado usando el menú de HOY (en vez
// de reusar el precio viejo tal cual venía guardado), por si cambiaste
// precios desde la última vez que se pidió — así "Pedir lo mismo" siempre
// cobra el precio correcto y actual.
function precioActualParaItem(historicoItem) {
  if (!historicoItem) return null;
  const qty = historicoItem.savedQty || 1;
  if (historicoItem.name === 'Poke') {
    const ingredientesGuardados = historicoItem.savedIngredients || {};
    const total = POKE_SERVICE_FEE + INGREDIENTES.reduce((sum, ing) => sum + (ingredientesGuardados[ing.key] ? ing.price : 0), 0);
    return '$' + (total * qty).toFixed(2);
  }
  const enMenu = PLATOS.concat(OTROS).find((m) => m.name === historicoItem.name);
  const unitNum = enMenu ? parsePriceNum(enMenu.price) : parsePriceNum(historicoItem.price);
  return unitNum != null ? ('$' + (unitNum * qty).toFixed(2)) : ((enMenu && enMenu.price) || historicoItem.price);
}

// Llena "Mi semana" con el pedido pagado más reciente (mismos platillos,
// mismos horarios si los había) y te manda a revisarlo antes de pagar —
// NUNCA cobra solo: siempre pasas otra vez por Confirmar pedido -> Pagar,
// para que puedas ajustar algo o ver el total antes de aceptar.
function repetirPedidoUltimoPedido() {
  if (!state.orderHistory || state.orderHistory.length === 0) return;
  const ultimo = state.orderHistory[0];
  const wo = {};
  const nuevosHorarios = {};
  DIAS.forEach((dia) => {
    const historicoItem = ultimo.items && ultimo.items[dia];
    if (!historicoItem) return;
    const enMenu = PLATOS.concat(OTROS).find((m) => m.name === historicoItem.name);
    const base = enMenu || historicoItem; // si ya no está en el menú, lo dejamos como venía guardado
    wo[dia] = {
      ...base,
      price: precioActualParaItem(historicoItem) ?? historicoItem.price,
      savedQty: historicoItem.savedQty ?? 1,
      savedIngredients: historicoItem.savedIngredients ?? null
    };
    if (ultimo.horarios && ultimo.horarios[dia]) nuevosHorarios[dia] = ultimo.horarios[dia];
  });
  const allDaysMatch = DIAS.every((d) => wo[d] && wo[d].name === (wo['Lunes'] && wo['Lunes'].name));
  setState({
    weekOrder: wo,
    horarios: nuevosHorarios,
    horarioEnabled: Object.keys(nuevosHorarios).length > 0,
    wholeWeek: allDaysMatch,
    plantel: ultimo.plantel || state.plantel,
    screen: 'semana'
  });
}

async function submitAuth() {
  const nameInput = document.getElementById('auth-name');
  const emailInput = document.getElementById('auth-email');
  const passwordInput = document.getElementById('auth-password');
  const name = nameInput ? nameInput.value.trim() : '';
  const email = (emailInput ? emailInput.value.trim() : '').toLowerCase();
  const password = passwordInput ? passwordInput.value : '';

  if (state.authMode === 'signup') {
    if (!name || !email || !password) {
      setState({ authError: 'Completa nombre, correo y contraseña.', authName: name, authEmail: email, authPassword: password });
      return;
    }
    if (!email.includes('@') || !email.includes('.')) {
      setState({ authError: 'Ingresa un correo válido.', authName: name, authEmail: email, authPassword: password });
      return;
    }
    if (password.length < 6) {
      setState({ authError: 'La contraseña debe tener al menos 6 caracteres.', authName: name, authEmail: email, authPassword: password });
      return;
    }

    let manejadoPorBackend = false;
    try {
      const r = await apiFetch('/api/register', { method: 'POST', body: { name, email, password, phone: '' } });
      if (r.ok && r.data && r.data.token) {
        setState({ screen: 'inicio', user: r.data.user, authToken: r.data.token, authError: '', authName: '', authEmail: '', authPassword: '' });
        loadOrderHistory();
        manejadoPorBackend = true;
      } else if (r.data && r.data.error) {
        setState({ authError: r.data.error, authName: name, authEmail: email, authPassword: password });
        manejadoPorBackend = true;
      }
    } catch (e) { /* sin backend configurado/desplegado o sin internet -> seguimos con el respaldo local */ }

    if (!manejadoPorBackend) {
      if (REGISTERED_USERS.some((u) => u.email === email)) {
        setState({ authError: 'Ya existe una cuenta con ese correo. Inicia sesión.', authName: name, authEmail: email, authPassword: password });
        return;
      }
      REGISTERED_USERS.push({ name, email, password, phone: '' });
      setState({ screen: 'inicio', user: { name, email, phone: '' }, authToken: '', authError: '', authName: '', authEmail: '', authPassword: '' });
    }
  } else {
    if (!email || !password) {
      setState({ authError: 'Completa correo y contraseña.', authEmail: email, authPassword: password });
      return;
    }

    let manejadoPorBackend = false;
    try {
      const r = await apiFetch('/api/login', { method: 'POST', body: { email, password } });
      if (r.ok && r.data && r.data.token) {
        setState({ screen: 'inicio', user: r.data.user, authToken: r.data.token, authError: '', authEmail: '', authPassword: '' });
        loadOrderHistory();
        manejadoPorBackend = true;
      } else if (r.data && r.data.error) {
        setState({ authError: r.data.error, authEmail: email, authPassword: password });
        manejadoPorBackend = true;
      }
    } catch (e) { /* sin backend configurado/desplegado o sin internet -> seguimos con el respaldo local */ }

    if (!manejadoPorBackend) {
      const found = REGISTERED_USERS.find((u) => u.email === email && u.password === password);
      if (!found) {
        setState({ authError: 'Correo o contraseña incorrectos.', authEmail: email, authPassword: password });
        return;
      }
      setState({ screen: 'inicio', user: { name: found.name, email: found.email, phone: found.phone || '' }, authToken: '', authError: '', authEmail: '', authPassword: '' });
    }
  }
}

  if (!email || !email.includes('@') || !email.includes('.')) {
    setState({ forgotError: 'Ingresa un correo válido.', forgotEmail: email });

  }

  setState({ forgotError: '', forgotLoading: true, forgotEmail: email });
  try {

    if (r.ok) {
      setState({
        screen: 'reset',

    setState({ forgotLoading: false, forgotError: 'No hay conexión con el servidor. Revisa tu internet e intenta de nuevo, o escríbenos por Ayuda.' });

async function submitResetPassword() {
  const codeInput = document.getElementById('reset-code');
  const passInput = document.getElementById('reset-password');
  const pass2Input = document.getElementById('reset-password2');
  const code = codeInput ? codeInput.value.trim() : '';
  const newPassword = passInput ? passInput.value : '';
  const newPassword2 = pass2Input ? pass2Input.value : '';

  if (!code) {
    setState({ resetError: 'Ingresa el código de 6 dígitos que te mandamos por correo.', resetCode: code, resetPassword: newPassword, resetPassword2: newPassword2 });

  if (newPassword.length < 6) {
    setState({ resetError: 'La contraseña debe tener al menos 6 caracteres.', resetCode: code, resetPassword: newPassword, resetPassword2: newPassword2 });

  if (newPassword !== newPassword2) {
    setState({ resetError: 'Las dos contraseñas no son iguales.', resetCode: code, resetPassword: newPassword, resetPassword2: newPassword2 });
    return;
  }

  setState({ resetError: '', resetLoading: true, resetCode: code, resetPassword: newPassword, resetPassword2: newPassword2 });
  try {
    const r = await apiFetch('/api/reset-password', { method: 'POST', body: { email: state.forgotEmail, code, newPassword } });

        resetError: '',

      });
    } else {
      setState({ resetLoading: false, resetError: (r.data && r.data.error) || 'No se pudo restablecer la contraseña. Intenta de nuevo.' });
    }
  } catch (e) {
    setState({ resetLoading: false, resetError: 'No hay conexión con el servidor. Revisa tu internet e intenta de nuevo.' });
  }
}

// Arma un Excel (.xlsx) con lo que ya está cargado en el panel — no vuelve a
// pedirle nada al servidor, solo empaqueta lo que ves en pantalla en varias
// hojas para que se lo puedas pasar a tu contador o abrirlo en una
// computadora. Usa la librería SheetJS (cargada en el <head> como "XLSX").
function exportarExcelAdmin() {
  const data = state.adminData;
  if (!data || typeof XLSX === 'undefined') return;

  const costsPorSemana = {};
  (data.costs || []).forEach((c) => { costsPorSemana[c.weekStart] = c; });

  const resumenRows = (data.weeks || []).map((w) => {
    const c = costsPorSemana[w.weekStart];
    const gastosCents = c ? (c.ingredientesCents + c.empaqueCents + c.otrosGastosCents) : 0;
    return {
      'Semana': fmtWeekLabel(w.weekStart),
      'Ventas': (w.ventasCents || 0) / 100,
      'Pedidos pagados': w.pedidosPagados || 0,
      'Ingredientes': c ? c.ingredientesCents / 100 : 0,
      'Empaque': c ? c.empaqueCents / 100 : 0,
      'Otros gastos': c ? c.otrosGastosCents / 100 : 0,
      'Ganancia neta': ((w.ventasCents || 0) - gastosCents) / 100
    };
  });

  const clientesRows = (data.customers || []).map((u) => ({
    'Nombre': u.name,
    'Correo': u.email,
    'Teléfono': u.phone || '',
    'Institución': u.plantel || '',
    'Cliente desde': u.createdAt || ''
  }));

  const platillosRows = (data.topDishesAllTime || []).map((p) => ({
    'Platillo': p.name,
    'Veces pedido': p.count
  }));

  const gastosRows = (data.costs || []).map((c) => ({
    'Semana': fmtWeekLabel(c.weekStart),
    'Ingredientes': c.ingredientesCents / 100,
    'Empaque': c.empaqueCents / 100,
    'Otros gastos': c.otrosGastosCents / 100,
    'Notas': c.notas || ''
  }));

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(resumenRows), 'Resumen semanal');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(clientesRows), 'Clientes');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(platillosRows), 'Platillos más vendidos');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(gastosRows), 'Gastos');

  const hoy = new Date().toISOString().slice(0, 10);
  XLSX.writeFile(wb, `ZANO - Reporte ${hoy}.xlsx`);
}

// pantalla, y lo confirma con el servidor; si falla, recarga desde el
// servidor para no quedar desincronizado con lo que ve el resto de cocina.
async function setPedidoStatus(orderId, dia, status) {
  if (!state.staffData) return;
  const rows = state.staffData.rows.map((r) => (r.orderId === orderId && r.dia === dia) ? { ...r, status } : r);
  setState({ staffData: { ...state.staffData, rows } });
  try {

      method: 'POST',

async function ajustarCroissant(delta) {
  if (state.staffCroissantBusy || !state.staffData) return;
  const anterior = state.staffData.croissantHoy;
  setState({ staffCroissantBusy: true, staffData: { ...state.staffData, croissantHoy: Math.max(0, anterior + delta) } });
  try {
    const r = await apiFetch('/api/staff?action=croissant', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + state.staffToken },
      body: { delta }
    });
    if (r.ok && r.data && typeof r.data.count === 'number') {
      setState({ staffCroissantBusy: false, staffData: { ...state.staffData, croissantHoy: r.data.count } });
    } else {
      setState({ staffCroissantBusy: false, staffData: { ...state.staffData, croissantHoy: anterior } });
    }
  } catch (e) {
    setState({ staffCroissantBusy: false, staffData: { ...state.staffData, croissantHoy: anterior } });
  }
}

function computeStaffGroups() {
  const rows = (state.staffData && state.staffData.rows) || [];
  const byStatus = { pendiente: [], en_proceso: [], listo: [], entregado: [] };
  rows.forEach((r) => { (byStatus[r.status] || byStatus.pendiente).push(r); });
  return byStatus;
}

// Mientras estos tres sigan con su valor de ejemplo, la app usa el respaldo
// manual (abrir tu app de correo + copiar el mensaje). Ver README para

const EMAILJS_PUBLIC_KEY = 'RnCJU-WPYbhp8KGl1';
const EMAILJS_SERVICE_ID = 'service_th96hsg';
const EMAILJS_TEMPLATE_ID = 'template_awc52as';

function emailjsListo() {
  return typeof emailjs !== 'undefined'
    && EMAILJS_PUBLIC_KEY !== 'TU_PUBLIC_KEY'
    && EMAILJS_SERVICE_ID !== 'TU_SERVICE_ID'

}

if (typeof emailjs !== 'undefined' && EMAILJS_PUBLIC_KEY !== 'TU_PUBLIC_KEY') {
  emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

function copiarTexto(texto) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(texto).catch(() => {});
  }
}

function enviarAyuda() {
  const textarea = document.getElementById('ayuda-mensaje');
  const mensaje = textarea ? textarea.value.trim() : '';
  if (!mensaje) {
    setState({ ayudaError: 'Escribe tu mensaje antes de enviarlo.' });
    return;
  }
  const nombre = state.user ? state.user.name : '';
  const correoUsuario = state.user ? state.user.email : '';
  const cuerpo = mensaje + '\n\n---\nEnviado desde la app ZANO\nNombre: ' + nombre + '\nCorreo: ' + correoUsuario;

  if (emailjsListo()) {
    setState({ ayudaError: '', ayudaEnviando: true });
    emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      to_email: AYUDA_CORREO,
      from_name: nombre,
      from_email: correoUsuario,
      message: mensaje
    }).then(() => {
      setState({ ayudaEnviando: false, ayudaSent: true, ayudaAutomatico: true, ayudaUltimoMensaje: cuerpo });
    }).catch(() => {
      // Si el envío automático falla (sin internet, cuota mensual agotada, etc.),
      // caemos al respaldo manual para que el mensaje no se pierda.
      enviarAyudaRespaldo(cuerpo);
    });
  } else {
    enviarAyudaRespaldo(cuerpo);
  }
}

function enviarAyudaRespaldo(cuerpo) {
  const asunto = 'Ayuda ZANO';
  const mailtoUrl = 'mailto:' + AYUDA_CORREO + '?subject=' + encodeURIComponent(asunto) + '&body=' + encodeURIComponent(cuerpo);

  // Respaldo: copiamos el mensaje al portapapeles por si el correo no abre solo
  // (pasa en algunos navegadores/celulares sin una app de correo configurada).
  copiarTexto(cuerpo);

  // Disparamos el mailto con un link real simulando el clic de la persona, en vez
  // de solo cambiar window.location.href — es más confiable para que el navegador
  // sí abra la app de correo, incluso dentro de vistas empotradas.
  const link = document.createElement('a');
  link.href = mailtoUrl;
  link.rel = 'noopener';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  setState({ ayudaError: '', ayudaEnviando: false, ayudaSent: true, ayudaAutomatico: false, ayudaUltimoMensaje: cuerpo });
}

function reiniciarAyuda() {
  setState({ ayudaSent: false, ayudaAutomatico: false, ayudaUltimoMensaje: '', ayudaError: '' });
}

function savePerfilInfo() {
  const emailInput = document.getElementById('profile-email');
  const phoneInput = document.getElementById('profile-phone');
  const passwordInput = document.getElementById('profile-password');
  const email = (emailInput ? emailInput.value.trim() : '').toLowerCase();
  const phone = phoneInput ? phoneInput.value.trim() : '';
  const password = passwordInput ? passwordInput.value : '';

  if (!email || !password) {
    setState({ profileInfoError: 'Completa correo y contraseña.' });
    return;
  }
  if (!email.includes('@') || !email.includes('.')) {
    setState({ profileInfoError: 'Ingresa un correo válido.' });
    return;
  }
  if (password.length < 6) {
    setState({ profileInfoError: 'La contraseña debe tener al menos 6 caracteres.' });
    return;
  }
  // otro usuario ya está usando ese correo
  if (REGISTERED_USERS.some((u) => u.email === email && u.email !== state.user.email)) {
    setState({ profileInfoError: 'Ya hay otra cuenta usando ese correo.' });
    return;
  }

  const rec = REGISTERED_USERS.find((u) => u.email === state.user.email);
  if (rec) {
    rec.email = email;
    rec.phone = phone;
    rec.password = password;
  }
  setState({
    user: { ...state.user, email, phone },
    profileInfoError: '',
    screen: 'perfil'
  });
}

          <button onclick="ajustarCroissant(-1)" aria-label="Restar uno" style="width:44px;height:44px;border-radius:999px;background:#FFFFFF;border:1px solid #E7E2D6;font-size:20px;font-weight:700;color:#1F2420;">−</button>

function renderAdminWeekPicker(data) {
  const weeks = data.weeks || [];
  if (weeks.length === 0) {
    return '<p style="margin:0;font-size:12.5px;color:#9AA096;">Todavía no hay semanas con pedidos pagados.</p>';
  }
  const current = state.adminSelectedWeek || weeks[0].weekStart;
  return `
    <select onchange="setState({adminSelectedWeek:this.value, adminCostSaved:false})">
      ${weeks.map((w) => `<option value="${w.weekStart}" ${current === w.weekStart ? 'selected' : ''}>${esc(fmtWeekLabel(w.weekStart))}</option>`).join('')}
    </select>
  `;
}

function renderAdminResumen(data) {
  const weeks = data.weeks || [];
  const costs = data.costs || [];
  const week = weeks.find((w) => w.weekStart === state.adminSelectedWeek) || weeks[0] || null;
  const cost = week ? costs.find((c) => c.weekStart === week.weekStart) : null;

  const ventas = week ? week.ventasCents : 0;
  const cogs = cost ? (cost.ingredientesCents + cost.empaqueCents) : 0;
  const opex = cost ? cost.otrosGastosCents : 0;
  const bruta = ventas - cogs;
  const neta = bruta - opex;

  const ventasTotalAllTime = weeks.reduce((s, w) => s + w.ventasCents, 0);
  const pedidosTotalAllTime = weeks.reduce((s, w) => s + w.pedidosPagados, 0);

  return `
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div>
        <div style="font-size:11.5px;font-weight:700;color:#6B7268;margin-bottom:6px;">SEMANA</div>
        ${renderAdminWeekPicker(data)}
      </div>

      ${week ? `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div class="admin-stat"><div class="val">${fmtMoney(ventas)}</div><div class="lbl">Ventas de la semana</div></div>
        <div class="admin-stat"><div class="val">${week.pedidosPagados}</div><div class="lbl">Pedidos pagados</div></div>
        <div class="admin-stat"><div class="val" style="color:${bruta >= 0 ? '#2B5D3F' : '#B4472A'};">${fmtMoney(bruta)}</div><div class="lbl">Ganancia bruta</div></div>
        <div class="admin-stat"><div class="val" style="color:${neta >= 0 ? '#2B5D3F' : '#B4472A'};">${fmtMoney(neta)}</div><div class="lbl">Ganancia neta</div></div>
      </div>
      ${!cost ? `
      <div style="display:flex;gap:8px;align-items:flex-start;background:#F0ECE0;border-radius:12px;padding:12px 14px;">
        ${icon('info', { w: 16, h: 16, stroke: '#6B7268', sw: 1.8 })}
        <span style="font-size:12px;line-height:1.4;color:#6B7268;">Todavía no capturas los gastos de esta semana, por eso la ganancia sale igual a las ventas. Ve a la pestaña "Gastos" para meterlos.</span>
      </div>` : ''}
      ` : `<p style="margin:0;font-size:12.5px;color:#9AA096;">Elige una semana con pedidos pagados.</p>`}

      <div class="card" style="padding:14px;">
        <div style="font-size:11.5px;font-weight:700;color:#6B7268;margin-bottom:4px;">ACUMULADO (últimos 6 meses)</div>
        <div class="admin-table-row"><span style="font-size:13px;color:#1F2420;">Ventas totales</span><span style="font-size:13px;font-weight:700;color:#1F2420;">${fmtMoney(ventasTotalAllTime)}</span></div>
        <div class="admin-table-row"><span style="font-size:13px;color:#1F2420;">Pedidos pagados</span><span style="font-size:13px;font-weight:700;color:#1F2420;">${pedidosTotalAllTime}</span></div>
        <div class="admin-table-row"><span style="font-size:13px;color:#1F2420;">Clientes registrados</span><span style="font-size:13px;font-weight:700;color:#1F2420;">${(data.customers || []).length}</span></div>
      </div>
    </div>
  `;
}

function renderAdminClientes(data) {
  const customers = data.customers || [];
  if (customers.length === 0) {
    return `<p style="margin:0;font-size:12.5px;color:#9AA096;text-align:center;padding:24px 0;">Todavía no hay clientes registrados.</p>`;
  }
  return `
    <div class="card" style="padding:2px 14px;">
      ${customers.map((c) => `
        <div class="admin-table-row" style="align-items:flex-start;flex-direction:column;gap:3px;padding:12px 0;">

function renderAdminPlatillos(data) {
  const weeks = data.weeks || [];
  const week = weeks.find((w) => w.weekStart === state.adminSelectedWeek) || weeks[0] || null;
  const weekDishes = week
    ? Object.entries(week.dishCounts).map(([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count)
    : [];
  const allTime = data.topDishesAllTime || [];
  const maxWeek = weekDishes[0] ? weekDishes[0].count : 1;
  const maxAll = allTime[0] ? allTime[0].count : 1;

  const renderList = (list, max) => list.length === 0
    ? `<p style="margin:0;font-size:12.5px;color:#9AA096;">Sin pedidos todavía.</p>`
    : list.map((d) => `
        <div style="margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;">
            <span style="font-weight:600;color:#1F2420;">${esc(d.name)}</span>
            <span style="color:#6B7268;">${d.count}</span>
          </div>
          <div style="height:7px;border-radius:999px;background:#F0ECE0;overflow:hidden;">
            <div style="height:100%;width:${Math.max(6, (d.count / max) * 100)}%;background:#2B5D3F;border-radius:999px;"></div>
          </div>
        </div>
      `).join('');

  return `
    <div style="display:flex;flex-direction:column;gap:16px;">
      <div>
        <div style="font-size:11.5px;font-weight:700;color:#6B7268;margin-bottom:6px;">SEMANA</div>
        ${renderAdminWeekPicker(data)}
      </div>
      <div class="card" style="padding:14px;">
        <div style="font-size:11.5px;font-weight:700;color:#6B7268;margin-bottom:10px;">MÁS PEDIDOS ESTA SEMANA</div>
        ${renderList(weekDishes, maxWeek)}
      </div>
      <div class="card" style="padding:14px;">
        <div style="font-size:11.5px;font-weight:700;color:#6B7268;margin-bottom:10px;">HISTÓRICO (últimos 6 meses)</div>
        ${renderList(allTime, maxAll)}
      </div>
    </div>
  `;
}
