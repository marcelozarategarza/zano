// Base fija del Poke (cebolla morada, mango, piña): no se puede quitar/poner.
const POKE_BASE = { protein: 0.32, carbs: 6, fat: 0.16, fiber: 0.64, weight: 40 };
const POKE_SERVICE_FEE = 85;

const ACCENT = '#E2703A';

// "Base de datos" simulada de cuentas — solo vive en memoria mientras la
// pestaña esté abierta (esta app no tiene backend real). Se reinicia al
// recargar la página.
const REGISTERED_USERS = [];

// ---------------------------------------------------------------------
// Estado
// ---------------------------------------------------------------------
let state = {
  screen: 'auth',          // auth | inicio | menu | semana | pago | pagoOk | perfil
  authMode: 'login',       // login | signup
  authName: '',
  authEmail: '',
  authPassword: '',

function setState(patch) {
  state = { ...state, ...patch };
  render();
}

// ---------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------
function parsePriceNum(str) {
  if (str == null) return null;
  const cleaned = String(str).replace(/[^0-9.]/g, '');
  if (!cleaned) return null;
  const n = parseFloat(cleaned);
  return isFinite(n) ? n : null;
}

function esc(str) {
  return String(str ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function icon(name, extra) {

  const icons = {
    leaf: '<path d="M5 19c8 0 13-5 13-13-8 0-13 5-13 13Z"/><path d="M5 19c2-5 5-8 9-10"/>',
    pin: '<path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.3"/>',
    chevronRight: '<path d="M9 6l6 6-6 6"/>',

    home: '<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-9"/><path d="M9.5 20v-6h5v6"/>',

// ---------------------------------------------------------------------
// Cálculos derivados (equivalentes a renderVals() del prototipo)
// ---------------------------------------------------------------------
function computeIngredientRows() {
  return INGREDIENTES.map((ing) => {
    const isSelected = !!state.ingredients[ing.key];
    return { ...ing, isSelected };
  });
}

function computePokeIngredientTotal() {
  return POKE_SERVICE_FEE + INGREDIENTES.reduce((sum, ing) => sum + (state.ingredients[ing.key] ? ing.price : 0), 0);
}

function computePokeMacros() {
  return INGREDIENTES.reduce((acc, ing) => {
    if (!state.ingredients[ing.key]) return acc;
    return {
      protein: acc.protein + ing.protein,
      carbs: acc.carbs + ing.carbs,
      fat: acc.fat + ing.fat,
      fiber: acc.fiber + ing.fiber,
      weight: acc.weight + ing.weight
    };
  }, { ...POKE_BASE });
}

function isPokeSelected() {
  return !!state.selected && state.selected.name === 'Poke';
}

function computeSelectedPriceLabel() {
  const selected = state.selected;
  if (!selected) return '';
  if (isPokeSelected()) {
    return '$' + (computePokeIngredientTotal() * state.qty).toFixed(2);
  }
  const unitNum = parsePriceNum(selected.price);
  return unitNum != null ? ('$' + (unitNum * state.qty).toFixed(2)) : selected.price;
}

function computeDiasConPedido() {
  return DIAS.map((dia) => {
    const item = state.weekOrder[dia] || null;
    return {
      dia,
      item,
      label: item ? item.name : 'Elegir platillo',
      price: item ? item.price : '',
      hasItem: !!item
    };
  });
}

function computeWeekTotalLabel(diasConPedido) {
  const diasParaTotal = diasConPedido.filter((d) => d.hasItem);
  if (diasParaTotal.length === 0) return '$0.00';
  const precios = diasParaTotal.map((d) => parsePriceNum(d.price));
  const faltante = precios.some((n) => n === null);
  const total = precios.reduce((sum, n) => sum + (n || 0), 0);
  return faltante ? ('$' + total.toFixed(2) + '+') : ('$' + total.toFixed(2));
}

// Versión numérica del total (para cobrar) — "complete" indica que TODOS los
// platillos del pedido tienen precio real (ninguno quedó en '[PRECIO]').
function computeWeekTotalNumber(diasConPedido) {
  const diasParaTotal = diasConPedido.filter((d) => d.hasItem);
  if (diasParaTotal.length === 0) return { total: 0, complete: true };
  const precios = diasParaTotal.map((d) => parsePriceNum(d.price));
  const complete = precios.every((n) => n !== null);
  const total = precios.reduce((sum, n) => sum + (n || 0), 0);
  return { total, complete };
}

// Próxima recolección: si hoy (Lunes-Viernes) ya tiene pedido, es esa.
// Si no, busca el siguiente día de la semana que sí tenga pedido.
function computeProximaRecoleccion() {
  const jsDay = new Date().getDay(); // 0=Dom,1=Lun,...,6=Sáb
  const todayIndex = (jsDay >= 1 && jsDay <= 5) ? jsDay - 1 : null;
  const itemFor = (idx) => state.weekOrder[DIAS[idx]] || null;

  if (todayIndex !== null) {
    const hoy = itemFor(todayIndex);
    if (hoy) return { dia: DIAS[todayIndex], item: hoy, esHoy: true };
  }

  const start = todayIndex !== null ? todayIndex + 1 : 0;
  for (let i = start; i < DIAS.length; i++) {
    const item = itemFor(i);
    if (item) return { dia: DIAS[i], item, esHoy: false };
  }
  for (let i = 0; i < (todayIndex ?? DIAS.length); i++) {
    const item = itemFor(i);
    if (item) return { dia: DIAS[i], item, esHoy: false };
  }
  return null;
}

// ---------------------------------------------------------------------
// Autenticación (simulada en memoria — sin backend real)
// ---------------------------------------------------------------------
// ---------------------------------------------------------------------
// Backend (opcional): cuentas y pedidos guardados en servidor, sin lo cual
// la app sigue funcionando en modo local (como antes) — ver README.
// ---------------------------------------------------------------------
const API_BASE = ''; // mismo dominio que la app una vez desplegada en Vercel

async function apiFetch(path, options) {
  options = options || {};
  const res = await fetch(API_BASE + path, {
    method: options.method || 'GET',
    headers: Object.assign({ 'Content-Type': 'application/json' }, options.headers || {}),
    body: options.body ? JSON.stringify(options.body) : undefined
  });
  let data = null;
  try { data = await res.json(); } catch (e) { /* respuesta sin JSON (p.ej. backend no desplegado) */ }
  return { ok: res.ok, status: res.status, data: data };
}

function computeWeekStartISO() {
  const d = new Date();
  const day = d.getDay(); // 0 domingo .. 6 sábado (hora local)
  const diff = (day === 0 ? -6 : 1) - day;
  const monday = new Date(d.getFullYear(), d.getMonth(), d.getDate() + diff);
  const yyyy = monday.getFullYear();
  const mm = String(monday.getMonth() + 1).padStart(2, '0');
  const dd = String(monday.getDate()).padStart(2, '0');
  return yyyy + '-' + mm + '-' + dd;
}

function guardarPedidoBackend(totalPesos) {
  if (!state.authToken) return; // sin sesión de backend -> no hay nada que guardar
  apiFetch('/api/order-save', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + state.authToken },
    body: { weekStart: computeWeekStartISO(), items: state.weekOrder, totalCents: Math.round((totalPesos || 0) * 100) }
  }).catch(() => {});
}

async function submitAuth() {
  const nameInput = document.getElementById('auth-name');
  const emailInput = document.getElementById('auth-email');
  const passwordInput = document.getElementById('auth-password');
  const name = nameInput ? nameInput.value.trim() : '';
  const email = (emailInput ? emailInput.value.trim() : '').toLowerCase();
  const password = passwordInput ? passwordInput.value : '';

  if (state.authMode === 'signup') {
    if (!name || !email || !password) {
      setState({ authError: 'Completa nombre, correo y contraseña.', authName: name, authEmail: email, authPassword: password });
      return;
    }
    if (!email.includes('@') || !email.includes('.')) {
      setState({ authError: 'Ingresa un correo válido.', authName: name, authEmail: email, authPassword: password });
      return;
    }
    if (password.length < 6) {
      setState({ authError: 'La contraseña debe tener al menos 6 caracteres.', authName: name, authEmail: email, authPassword: password });
      return;
    }

    let manejadoPorBackend = false;
    try {
      const r = await apiFetch('/api/register', { method: 'POST', body: { name, email, password, phone: '' } });
      if (r.ok && r.data && r.data.token) {
        setState({ screen: 'inicio', user: r.data.user, authToken: r.data.token, authError: '', authName: '', authEmail: '', authPassword: '' });
        manejadoPorBackend = true;
      } else if (r.data && r.data.error) {
        setState({ authError: r.data.error, authName: name, authEmail: email, authPassword: password });
        manejadoPorBackend = true;
      }
    } catch (e) { /* sin backend configurado/desplegado o sin internet -> seguimos con el respaldo local */ }

    if (!manejadoPorBackend) {
      if (REGISTERED_USERS.some((u) => u.email === email)) {
        setState({ authError: 'Ya existe una cuenta con ese correo. Inicia sesión.', authName: name, authEmail: email, authPassword: password });
        return;
      }
      REGISTERED_USERS.push({ name, email, password, phone: '' });
      setState({ screen: 'inicio', user: { name, email, phone: '' }, authToken: '', authError: '', authName: '', authEmail: '', authPassword: '' });
    }
  } else {
    if (!email || !password) {
      setState({ authError: 'Completa correo y contraseña.', authEmail: email, authPassword: password });
      return;
    }

    let manejadoPorBackend = false;
    try {
      const r = await apiFetch('/api/login', { method: 'POST', body: { email, password } });
      if (r.ok && r.data && r.data.token) {
        setState({ screen: 'inicio', user: r.data.user, authToken: r.data.token, authError: '', authEmail: '', authPassword: '' });
        manejadoPorBackend = true;
      } else if (r.data && r.data.error) {
        setState({ authError: r.data.error, authEmail: email, authPassword: password });
        manejadoPorBackend = true;
      }
    } catch (e) { /* sin backend configurado/desplegado o sin internet -> seguimos con el respaldo local */ }

    if (!manejadoPorBackend) {
      const found = REGISTERED_USERS.find((u) => u.email === email && u.password === password);
      if (!found) {
        setState({ authError: 'Correo o contraseña incorrectos.', authEmail: email, authPassword: password });
        return;
      }
      setState({ screen: 'inicio', user: { name: found.name, email: found.email, phone: found.phone || '' }, authToken: '', authError: '', authEmail: '', authPassword: '' });
    }
  }
}

function mountPayPalButton(amount) {
  const container = document.getElementById('paypal-button-container');

  if (typeof paypal === 'undefined' || !paypal.Buttons) {
    container.innerHTML = '<p style="margin:0;font-size:12px;color:#B4472A;text-align:center;">No se pudo cargar PayPal (revisa tu conexión a internet, o que el Client ID en el &lt;head&gt; esté bien configurado).</p>';
    return;
  }

  paypal.Buttons({
    style: { layout: 'vertical', color: 'gold', shape: 'pill', label: 'pay' },
    createOrder: function (data, actions) {
      return actions.order.create({
        purchase_units: [{
          description: 'Pedido semanal ZANO',
          amount: { value: amount.toFixed(2), currency_code: 'MXN' }
        }]

    },

      setState({ paymentError: 'Cancelaste el pago. Puedes intentarlo de nuevo cuando quieras.' });
    },

      console.error('Error de PayPal:', err);

const AYUDA_CORREO = 'zano.ayuda@gmail.com';

// Datos de EmailJS para mandar el correo de "Ayuda" solo, sin backend.
// Mientras estos tres sigan con su valor de ejemplo, la app usa el respaldo
// manual (abrir tu app de correo + copiar el mensaje). Ver README para
// configurar tu cuenta real de EmailJS y poner tus valores aquí.
const EMAILJS_PUBLIC_KEY = 'RnCJU-WPYbhp8KGl1';
const EMAILJS_SERVICE_ID = 'service_th96hsg';
const EMAILJS_TEMPLATE_ID = 'template_awc52as';

function emailjsListo() {
  return typeof emailjs !== 'undefined'
    && EMAILJS_PUBLIC_KEY !== 'TU_PUBLIC_KEY'
    && EMAILJS_SERVICE_ID !== 'TU_SERVICE_ID'
    && EMAILJS_TEMPLATE_ID !== 'TU_TEMPLATE_ID';
}

if (typeof emailjs !== 'undefined' && EMAILJS_PUBLIC_KEY !== 'TU_PUBLIC_KEY') {
  emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
}

function copiarTexto(texto) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(texto).catch(() => {});
  }
}

function enviarAyuda() {
  const textarea = document.getElementById('ayuda-mensaje');
  const mensaje = textarea ? textarea.value.trim() : '';
  if (!mensaje) {
    setState({ ayudaError: 'Escribe tu mensaje antes de enviarlo.' });
    return;
  }
  const nombre = state.user ? state.user.name : '';
  const correoUsuario = state.user ? state.user.email : '';
  const cuerpo = mensaje + '\n\n---\nEnviado desde la app ZANO\nNombre: ' + nombre + '\nCorreo: ' + correoUsuario;

  if (emailjsListo()) {
    setState({ ayudaError: '', ayudaEnviando: true });
    emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      to_email: AYUDA_CORREO,
      from_name: nombre,
      from_email: correoUsuario,
      message: mensaje
    }).then(() => {
      setState({ ayudaEnviando: false, ayudaSent: true, ayudaAutomatico: true, ayudaUltimoMensaje: cuerpo });
    }).catch(() => {
      // Si el envío automático falla (sin internet, cuota mensual agotada, etc.),
      // caemos al respaldo manual para que el mensaje no se pierda.
      enviarAyudaRespaldo(cuerpo);
    });
  } else {
    enviarAyudaRespaldo(cuerpo);
  }
}

function enviarAyudaRespaldo(cuerpo) {
  const asunto = 'Ayuda ZANO';
  const mailtoUrl = 'mailto:' + AYUDA_CORREO + '?subject=' + encodeURIComponent(asunto) + '&body=' + encodeURIComponent(cuerpo);

  // Respaldo: copiamos el mensaje al portapapeles por si el correo no abre solo
  // (pasa en algunos navegadores/celulares sin una app de correo configurada).
  copiarTexto(cuerpo);

  // Disparamos el mailto con un link real simulando el clic de la persona, en vez
  // de solo cambiar window.location.href — es más confiable para que el navegador
  // sí abra la app de correo, incluso dentro de vistas empotradas.
  const link = document.createElement('a');
  link.href = mailtoUrl;
  link.rel = 'noopener';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);

  setState({ ayudaError: '', ayudaEnviando: false, ayudaSent: true, ayudaAutomatico: false, ayudaUltimoMensaje: cuerpo });
}

function reiniciarAyuda() {
  setState({ ayudaSent: false, ayudaAutomatico: false, ayudaUltimoMensaje: '', ayudaError: '' });
}

function savePerfilInfo() {
  const emailInput = document.getElementById('profile-email');
  const phoneInput = document.getElementById('profile-phone');
  const passwordInput = document.getElementById('profile-password');
  const email = (emailInput ? emailInput.value.trim() : '').toLowerCase();
  const phone = phoneInput ? phoneInput.value.trim() : '';
  const password = passwordInput ? passwordInput.value : '';

  if (!email || !password) {
    setState({ profileInfoError: 'Completa correo y contraseña.' });
    return;
  }
  if (!email.includes('@') || !email.includes('.')) {
    setState({ profileInfoError: 'Ingresa un correo válido.' });
    return;
  }
  if (password.length < 6) {
    setState({ profileInfoError: 'La contraseña debe tener al menos 6 caracteres.' });
    return;
  }
  // otro usuario ya está usando ese correo
  if (REGISTERED_USERS.some((u) => u.email === email && u.email !== state.user.email)) {
    setState({ profileInfoError: 'Ya hay otra cuenta usando ese correo.' });
    return;
  }

  const rec = REGISTERED_USERS.find((u) => u.email === state.user.email);
  if (rec) {
    rec.email = email;
    rec.phone = phone;
    rec.password = password;
  }
  setState({
    user: { ...state.user, email, phone },
    profileInfoError: '',
    screen: 'perfil'
  });
}

  if (state.pickingDay) {

// ---------------------------------------------------------------------
// Render: Mi semana
// ---------------------------------------------------------------------
function renderSemana() {
  const diasConPedido = computeDiasConPedido();
  const wholeWeek = state.wholeWeek;
  const allDaysMatch = DIAS.every((d) => state.weekOrder[d] && state.weekOrder[d].name === (state.weekOrder['Lunes'] && state.weekOrder['Lunes'].name));
  const allWeekItem = allDaysMatch ? state.weekOrder['Lunes'] : null;
  const allWeekLabel = allWeekItem ? allWeekItem.name : 'Elegir platillo';
  const weekTotalLabel = computeWeekTotalLabel(diasConPedido);
  const diasConHorario = diasConPedido.filter((d) => d.hasItem);

  return `
    <div style="display:flex;flex-direction:column;gap:16px;">
      <div>
        <h1 style="margin:0 0 6px 0;font-family:'Fraunces',serif;font-weight:600;font-size:28px;color:#1F2420;">Mi semana</h1>
        <p style="margin:0;font-size:13.5px;color:#6B7268;">Arma tu pedido de Lunes a Viernes de una sola vez.</p>
      </div>

      <button onclick="setState({wholeWeek: !state.wholeWeek})" class="card" style="width:100%;padding:14px;display:flex;align-items:center;justify-content:space-between;text-align:left;">
        <span style="font-size:13.5px;font-weight:600;color:#1F2420;">Pedir lo mismo toda la semana</span>
        <span style="width:42px;height:24px;border-radius:999px;background:${wholeWeek ? '#2B5D3F' : '#D8D2C2'};position:relative;display:inline-block;flex-shrink:0;">
          <span style="width:18px;height:18px;border-radius:999px;background:#FFFFFF;position:absolute;top:3px;left:${wholeWeek ? '21px' : '3px'};"></span>
        </span>
      </button>

      ${wholeWeek ? `
      <button onclick="setState({screen:'menu', selected:null, pickingDay:'ALL'})" class="card" style="width:100%;padding:16px;display:flex;align-items:center;justify-content:space-between;text-align:left;">
        <div style="display:flex;flex-direction:column;gap:3px;">
          <span style="font-size:13px;color:#6B7268;">Platillo para toda la semana</span>
          <span style="font-size:14.5px;font-weight:600;color:#1F2420;">${esc(allWeekLabel)}</span>
        </div>
        ${icon('chevronRight', { w: 18, h: 18 })}
      </button>` : `
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${diasConPedido.map((d) => `
          <div style="display:flex;align-items:center;gap:8px;">
            <button onclick='pickDay(${JSON.stringify(d.dia)})' class="card" style="flex:1;min-width:0;padding:14px;display:flex;align-items:center;justify-content:space-between;text-align:left;">
              <div style="display:flex;flex-direction:column;gap:2px;min-width:0;">
                <span style="font-size:12px;color:#6B7268;">${d.dia}</span>
                <span style="font-size:14px;font-weight:600;color:#1F2420;">${esc(d.label)}</span>
              </div>
              ${icon('chevronRight', { w: 18, h: 18 })}
            </button>
            ${d.hasItem ? `<button onclick='clearDay(${JSON.stringify(d.dia)})' aria-label="Quitar platillo del día" style="width:38px;height:38px;border-radius:999px;background:#FFFFFF;border:1px solid #E7E2D6;display:flex;align-items:center;justify-content:center;flex-shrink:0;">${icon('x', { w: 16, h: 16 })}</button>` : ''}
          </div>
        `).join('')}
      </div>`}

      <div style="display:flex;gap:10px;align-items:flex-start;background:#E4ECE1;border-radius:14px;padding:14px;">
        ${icon('info', { w: 18, h: 18, stroke: '#2B5D3F', sw: 1.8 })}
        <span style="font-size:12.5px;line-height:1.5;color:#2B5D3F;">Pide con 3 días de anticipación. Si no pediste, ese día hay croissant con huevito y jamón preparado al momento.</span>
      </div>

      ${diasConHorario.length > 0 ? `
      <button onclick="setState({horarioEnabled: !state.horarioEnabled})" class="card" style="width:100%;padding:14px;display:flex;align-items:center;justify-content:space-between;text-align:left;">
        <div style="display:flex;flex-direction:column;gap:2px;">
          <span style="font-size:13.5px;font-weight:600;color:#1F2420;">Elegir horario de recogida</span>
          <span style="font-size:11px;color:#6B7268;">Opcional — lo preparamos justo antes para que llegue caliente.</span>
        </div>
        <span style="width:42px;height:24px;border-radius:999px;background:${state.horarioEnabled ? '#2B5D3F' : '#D8D2C2'};position:relative;display:inline-block;flex-shrink:0;">
          <span style="width:18px;height:18px;border-radius:999px;background:#FFFFFF;position:absolute;top:3px;left:${state.horarioEnabled ? '21px' : '3px'};"></span>
        </span>
      </button>` : ''}

      ${state.horarioEnabled && diasConHorario.length > 0 ? `
      <div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${diasConHorario.map((d) => {
            const dia = d.dia;
            const selectedHorario = state.horarios[dia] ?? null;
            const isOpen = state.horarioPickerDay === dia;
            return `
            <div>
              <button onclick='setState({horarioPickerDay: ${JSON.stringify(isOpen ? null : dia)}})' class="card" style="width:100%;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;">
                <div style="display:flex;flex-direction:column;gap:1px;">
                  <span style="font-size:11.5px;color:#6B7268;">${dia}</span>
                  <span style="font-size:14px;font-weight:600;color:#1F2420;">${esc(selectedHorario ?? 'Elige tu horario')}</span>
                </div>
                ${icon(isOpen ? 'chevronDown' : 'chevronRight', { w: 18, h: 18 })}
              </button>
              ${isOpen ? `
              <div class="card" style="overflow:hidden;margin-top:6px;max-height:220px;overflow-y:auto;">
                ${HORARIOS.map((h) => {
                  const sel = selectedHorario === h;
                  return `<button onclick='setState({horarios:{...state.horarios, [${JSON.stringify(dia)}]:${JSON.stringify(h)}}, horarioPickerDay:null})' style="width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #F0ECE0;background:${sel ? '#E4ECE1' : '#FFFFFF'};text-align:left;">
                    <span style="font-size:13.5px;font-weight:600;color:${sel ? '#2B5D3F' : '#1F2420'};">${h}</span>
                    ${sel ? icon('check', { w: 16, h: 16, stroke: '#2B5D3F', sw: 2.2 }) : ''}
                  </button>`;
                }).join('')}
              </div>` : ''}
            </div>`;
          }).join('')}
        </div>
      </div>` : ''}

      <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px;">
        <div class="row">
          <span style="font-size:13.5px;color:#6B7268;">Total de la semana</span>
          <span style="font-size:18px;font-weight:700;color:${ACCENT};">${weekTotalLabel}</span>
        </div>
        <button onclick="setState({screen:'pago'})" style="width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:${ACCENT};color:#FFFFFF;border-radius:12px;padding:15px;font-size:14.5px;font-weight:700;">Confirmar pedido de la semana</button>
      </div>
    </div>
  `;
}

// ---------------------------------------------------------------------
// Render: Pago / PagoOk
// ---------------------------------------------------------------------
function renderPago() {
  const diasConPedido = computeDiasConPedido();
  const diasConHorario = diasConPedido.filter((d) => d.hasItem);
  const count = diasConHorario.length;
  const weekTotalLabel = computeWeekTotalLabel(diasConPedido);
  const { total: weekTotalNum, complete: weekTotalComplete } = computeWeekTotalNumber(diasConPedido);
  const canPay = weekTotalComplete && weekTotalNum > 0;

  return `
    <div style="display:flex;flex-direction:column;height:100%;">
      <div class="row" style="margin-bottom:22px;">
        <button onclick="setState({screen:'semana'})" style="font-size:15px;color:#2B5D3F;font-weight:500;">Cancelar</button>
        <span style="font-size:16px;font-weight:700;color:#1F2420;">Pagar</span>
        <span style="width:56px;"></span>
      </div>

      <div class="card" style="border-radius:16px;overflow:hidden;margin-bottom:24px;">
        <div style="display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid #F0ECE0;">
          ${icon('leaf', { w: 22, h: 22, stroke: '#2B5D3F', sw: 1.7 })}
          <div style="display:flex;flex-direction:column;gap:1px;">
            <span style="font-size:14px;font-weight:700;color:#1F2420;">ZANO</span>
            <span style="font-size:12px;color:#6B7268;">Pedido semanal · ${count} días</span>
          </div>
        </div>

        ${state.horarioEnabled && diasConHorario.length > 0 ? `
        <div style="padding:14px 16px;border-bottom:1px solid #F0ECE0;display:flex;flex-direction:column;gap:6px;">
          <span style="font-size:11px;font-weight:700;color:#6B7268;text-transform:uppercase;letter-spacing:0.4px;">Horario de recogida</span>
          ${diasConHorario.map((d) => `
            <div class="row">
              <span style="font-size:12.5px;color:#6B7268;">${d.dia}</span>
              <span style="font-size:12.5px;font-weight:600;color:#1F2420;">${esc(state.horarios[d.dia] ?? 'Elige tu horario')}</span>
            </div>
          `).join('')}
        </div>` : ''}

        <div class="row" style="padding:16px;">
          <span style="font-size:14px;font-weight:600;color:#1F2420;">Total</span>
          <span style="font-size:20px;font-weight:700;color:${ACCENT};">${weekTotalLabel}</span>
        </div>
      </div>

      <div style="flex:1;"></div>

      <div style="display:flex;flex-direction:column;align-items:center;gap:14px;padding-bottom:36px;">
        ${state.paymentError ? `
        <div style="display:flex;gap:8px;align-items:flex-start;background:#FBEAE5;border-radius:12px;padding:12px 14px;width:100%;box-sizing:border-box;">
          ${icon('info', { w: 16, h: 16, stroke: '#B4472A', sw: 1.8 })}
          <span style="font-size:12.5px;line-height:1.4;color:#B4472A;">${esc(state.paymentError)}</span>
        </div>` : ''}

        ${!weekTotalComplete ? `
        <div style="display:flex;gap:8px;align-items:flex-start;background:#FBEAE5;border-radius:12px;padding:12px 14px;width:100%;box-sizing:border-box;">
          ${icon('info', { w: 16, h: 16, stroke: '#B4472A', sw: 1.8 })}
          <span style="font-size:12.5px;line-height:1.4;color:#B4472A;">Uno o más platillos de tu semana todavía no tienen precio definido, así que no podemos cobrarte un total exacto. Quítalos desde Mi semana o espera a que se les asigne precio.</span>
        </div>` : !canPay ? `
        <div style="display:flex;gap:8px;align-items:flex-start;background:#FBEAE5;border-radius:12px;padding:12px 14px;width:100%;box-sizing:border-box;">
          ${icon('info', { w: 16, h: 16, stroke: '#B4472A', sw: 1.8 })}
          <span style="font-size:12.5px;line-height:1.4;color:#B4472A;">Agrega al menos un platillo a tu semana para poder pagar.</span>
        </div>` : `
        <div id="paypal-button-container" style="width:100%;"></div>
        <p style="margin:0;font-size:11px;line-height:1.4;color:#9AA096;text-align:center;">Pago real procesado por PayPal — se te cobrará de verdad al confirmar.</p>`}
      </div>
    </div>
  `;
}

          </button>
          ${state.ayudaOpen ? (
            state.ayudaSent ? `
            <div style="padding:4px 16px 16px;display:flex;flex-direction:column;gap:10px;">
              ${state.ayudaAutomatico ? `
              <p style="margin:0;font-size:11.5px;line-height:1.4;color:#2B5D3F;">Listo — tu mensaje ya se envió automáticamente a <strong>${AYUDA_CORREO}</strong>. No necesitas hacer nada más.</p>
              ` : `
              <p style="margin:0;font-size:11.5px;line-height:1.4;color:#2B5D3F;">Tu mensaje quedó listo para <strong>${AYUDA_CORREO}</strong> y se debió abrir tu app de correo con todo redactado — solo confírmalo ahí. Por si esa app no abrió sola, ya copiamos el mensaje: pégalo en cualquier correo nuevo dirigido a esa dirección.</p>
              <button onclick="copiarTexto(state.ayudaUltimoMensaje)" style="width:100%;box-sizing:border-box;padding:12px;border-radius:12px;font-size:13px;font-weight:700;background:#F0ECE0;color:#1F2420;">Copiar mensaje de nuevo</button>
              `}
              <button onclick="reiniciarAyuda()" style="width:100%;box-sizing:border-box;padding:12px;border-radius:12px;font-size:13px;font-weight:700;background:transparent;color:#6B7268;border:1px solid #D8D3C4;">Escribir otro mensaje</button>
            </div>` : `
            <div style="padding:4px 16px 16px;display:flex;flex-direction:column;gap:10px;">
              <p style="margin:0;font-size:11.5px;line-height:1.4;color:#6B7268;">Escribe tu mensaje — se manda directo a ${AYUDA_CORREO}.</p>
              <textarea id="ayuda-mensaje" placeholder="¿En qué te podemos ayudar?" ${state.ayudaEnviando ? 'disabled' : ''}></textarea>
              ${state.ayudaError ? `<span style="font-size:11.5px;color:#B4472A;">${esc(state.ayudaError)}</span>` : ''}
              <button onclick="enviarAyuda()" ${state.ayudaEnviando ? 'disabled' : ''} style="width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:${ACCENT};color:#FFFFFF;border-radius:12px;padding:13px;font-size:13.5px;font-weight:700;opacity:${state.ayudaEnviando ? '0.6' : '1'};">${state.ayudaEnviando ? 'Enviando…' : 'Enviar por correo'}</button>
            </div>`
          ) : ''}
        </div>
      </div>

      <button onclick="logout()" style="width:100%;text-align:center;padding:14px;font-size:13.5px;font-weight:700;color:#B4472A;">Cerrar sesión</button>
    </div>
  `;
}

// ---------------------------------------------------------------------
// Render: Información de mi perfil (correo, teléfono, contraseña)
// ---------------------------------------------------------------------
function renderPerfilInfo() {
  const user = state.user || { name: '', email: '', phone: '' };
  return `
    <div style="display:flex;flex-direction:column;gap:18px;">
      <button onclick="setState({screen:'perfil'})" style="display:flex;align-items:center;gap:6px;color:#6B7268;font-size:13px;font-weight:600;">
        ${icon('chevronRight', { w: 16, h: 16 }).replace('M9 6l6 6-6 6', 'M15 6l-6 6 6 6')} Volver a Perfil
      </button>

      <div>
        <h1 style="margin:0 0 6px 0;font-family:'Fraunces',serif;font-weight:600;font-size:26px;color:#1F2420;">Información de tu perfil</h1>
        <p style="margin:0;font-size:13px;line-height:1.5;color:#6B7268;">${esc(user.name)}</p>
      </div>

      <div style="display:flex;flex-direction:column;gap:12px;">
        <div style="display:flex;flex-direction:column;gap:6px;">
          <label style="font-size:12.5px;font-weight:600;color:#1F2420;">Correo</label>
          <input id="profile-email" type="email" value="${esc(user.email)}" placeholder="tucorreo@ejemplo.com">
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          <label style="font-size:12.5px;font-weight:600;color:#1F2420;">Número telefónico</label>
          <input id="profile-phone" type="text" value="${esc(user.phone)}" placeholder="81 0000 0000">
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          <label style="font-size:12.5px;font-weight:600;color:#1F2420;">Contraseña</label>
          <input id="profile-password" type="text" value="${esc(REGISTERED_USERS.find((u) => u.email === user.email)?.password ?? '')}" placeholder="Tu contraseña">
        </div>
      </div>

      ${state.profileInfoError ? `
      <div style="display:flex;gap:8px;align-items:flex-start;background:#FBEAE5;border-radius:12px;padding:12px 14px;">
        ${icon('info', { w: 16, h: 16, stroke: '#B4472A', sw: 1.8 })}
        <span style="font-size:12.5px;line-height:1.4;color:#B4472A;">${esc(state.profileInfoError)}</span>
      </div>` : ''}

      <button onclick="savePerfilInfo()" class="pill-btn">Guardar cambios</button>

      <p style="margin:0;font-size:11px;line-height:1.5;color:#9AA096;text-align:center;">Esta es una demo: estos datos solo viven en memoria mientras tengas la pestaña abierta.</p>
    </div>
  `;
}

// ---------------------------------------------------------------------
// Render principal
// ---------------------------------------------------------------------
function render() {
  const contentEl = document.getElementById('content');
  const navEl = document.getElementById('nav');
  const showNav = state.screen !== 'pago' && state.screen !== 'pagoOk' && state.screen !== 'auth' && state.screen !== 'perfilInfo';

  let html = '';
  if (state.screen === 'auth') html = renderAuth();
  else if (state.screen === 'inicio') html = renderInicio();
  else if (state.screen === 'menu') html = state.selected ? renderMenuDetail() : renderMenuList();
  else if (state.screen === 'semana') html = renderSemana();
  else if (state.screen === 'pago') html = renderPago();
  else if (state.screen === 'pagoOk') html = renderPagoOk();
  else if (state.screen === 'perfil') html = renderPerfil();
  else if (state.screen === 'perfilInfo') html = renderPerfilInfo();

  contentEl.style.bottom = showNav ? '84px' : '0px';
  contentEl.innerHTML = html;
  contentEl.scrollTop = 0;

  if (state.screen === 'pago') {
    const diasConPedido = computeDiasConPedido();
    const { total, complete } = computeWeekTotalNumber(diasConPedido);
    guardarPedidoBackend(total);
    if (complete && total > 0) {
      mountPayPalButton(total);
    }
  }

  if (showNav) {
    const isInicio = state.screen === 'inicio';
    const isMenu = state.screen === 'menu';
    const isSemana = state.screen === 'semana';
    const isPerfil = state.screen === 'perfil';
    navEl.style.display = 'flex';
    navEl.innerHTML = `
      <button class="nav-item ${isInicio ? 'active' : ''}" onclick="setState({screen:'inicio'})">
        ${icon('home', { w: 22, h: 22, stroke: 'currentColor', sw: 1.7 })}<span>Inicio</span>
      </button>
      <button class="nav-item ${isMenu ? 'active' : ''}" onclick="setState({screen:'menu', selected:null, pickingDay:null})">
        ${icon('menu', { w: 22, h: 22, stroke: 'currentColor', sw: 1.7 })}<span>Menú</span>
      </button>
      <button class="nav-item ${isSemana ? 'active' : ''}" onclick="setState({screen:'semana'})">
        ${icon('week', { w: 22, h: 22, stroke: 'currentColor', sw: 1.7 })}<span>Mi semana</span>
      </button>
      <button class="nav-item ${isPerfil ? 'active' : ''}" onclick="setState({screen:'perfil'})">
        ${icon('user', { w: 22, h: 22, stroke: 'currentColor', sw: 1.7 })}<span>Perfil</span>
      </button>
    `;
    navEl.querySelectorAll('.nav-item').forEach((el) => { el.style.color = el.classList.contains('active') ? '#2B5D3F' : '#9AA096'; });
  } else {
    navEl.style.display = 'none';
  }
}

render();
</script>
</body>
</html>
