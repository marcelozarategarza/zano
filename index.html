        <p style="margin:0;font-size:13.5px;color:#6B7268;">Arma tu pedido de Lunes a Viernes de una sola vez.</p>
      </div>

      <button onclick="setState({wholeWeek: !state.wholeWeek})" class="card" style="width:100%;padding:14px;display:flex;align-items:center;justify-content:space-between;text-align:left;">
        <span style="font-size:13.5px;font-weight:600;color:#1F2420;">Pedir lo mismo toda la semana</span>
        <span style="width:42px;height:24px;border-radius:999px;background:${wholeWeek ? '#2B5D3F' : '#D8D2C2'};position:relative;display:inline-block;flex-shrink:0;">
          <span style="width:18px;height:18px;border-radius:999px;background:#FFFFFF;position:absolute;top:3px;left:${wholeWeek ? '21px' : '3px'};"></span>
        </span>
      </button>

      ${wholeWeek ? `
      <button onclick="setState({screen:'menu', selected:null, pickingDay:'ALL'})" class="card" style="width:100%;padding:16px;display:flex;align-items:center;justify-content:space-between;text-align:left;">
        <div style="display:flex;flex-direction:column;gap:3px;">
          <span style="font-size:13px;color:#6B7268;">Platillo para toda la semana</span>
          <span style="font-size:14.5px;font-weight:600;color:#1F2420;">${esc(allWeekLabel)}</span>
        </div>
        ${icon('chevronRight', { w: 18, h: 18 })}
      </button>` : `
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${diasConPedido.map((d) => `
          <div style="display:flex;align-items:center;gap:8px;">
            <button onclick='pickDay(${JSON.stringify(d.dia)})' class="card" style="flex:1;min-width:0;padding:14px;display:flex;align-items:center;justify-content:space-between;text-align:left;">
              <div style="display:flex;flex-direction:column;gap:2px;min-width:0;">
                <span style="font-size:12px;color:#6B7268;">${d.dia}</span>
                <span style="font-size:14px;font-weight:600;color:#1F2420;">${esc(d.label)}</span>
              </div>
              ${icon('chevronRight', { w: 18, h: 18 })}
            </button>
            ${d.hasItem ? `<button onclick='clearDay(${JSON.stringify(d.dia)})' aria-label="Quitar platillo del día" style="width:38px;height:38px;border-radius:999px;background:#FFFFFF;border:1px solid #E7E2D6;display:flex;align-items:center;justify-content:center;flex-shrink:0;">${icon('x', { w: 16, h: 16 })}</button>` : ''}
          </div>
        `).join('')}
      </div>`}

      <div style="display:flex;gap:10px;align-items:flex-start;background:#E4ECE1;border-radius:14px;padding:14px;">
        ${icon('info', { w: 18, h: 18, stroke: '#2B5D3F', sw: 1.8 })}
        <span style="font-size:12.5px;line-height:1.5;color:#2B5D3F;">Pide con 3 días de anticipación. Si no pediste, ese día hay croissant con huevito y jamón preparado al momento.</span>
      </div>

      ${diasConHorario.length > 0 ? `
      <button onclick="setState({horarioEnabled: !state.horarioEnabled})" class="card" style="width:100%;padding:14px;display:flex;align-items:center;justify-content:space-between;text-align:left;">
        <div style="display:flex;flex-direction:column;gap:2px;">
          <span style="font-size:13.5px;font-weight:600;color:#1F2420;">Elegir horario de recogida</span>
          <span style="font-size:11px;color:#6B7268;">Opcional — lo preparamos justo antes para que llegue caliente.</span>
        </div>
        <span style="width:42px;height:24px;border-radius:999px;background:${state.horarioEnabled ? '#2B5D3F' : '#D8D2C2'};position:relative;display:inline-block;flex-shrink:0;">
          <span style="width:18px;height:18px;border-radius:999px;background:#FFFFFF;position:absolute;top:3px;left:${state.horarioEnabled ? '21px' : '3px'};"></span>
        </span>
      </button>` : ''}

      ${state.horarioEnabled && diasConHorario.length > 0 ? `
      <div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${diasConHorario.map((d) => {
            const dia = d.dia;
            const selectedHorario = state.horarios[dia] ?? null;
            const isOpen = state.horarioPickerDay === dia;
            return `
            <div>
              <button onclick='setState({horarioPickerDay: ${JSON.stringify(isOpen ? null : dia)}})' class="card" style="width:100%;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;">
                <div style="display:flex;flex-direction:column;gap:1px;">
                  <span style="font-size:11.5px;color:#6B7268;">${dia}</span>
                  <span style="font-size:14px;font-weight:600;color:#1F2420;">${esc(selectedHorario ?? 'Elige tu horario')}</span>
                </div>
                ${icon(isOpen ? 'chevronDown' : 'chevronRight', { w: 18, h: 18 })}
              </button>
              ${isOpen ? `
              <div class="card" style="overflow:hidden;margin-top:6px;max-height:220px;overflow-y:auto;">
                ${HORARIOS.map((h) => {
                  const sel = selectedHorario === h;
                  return `<button onclick='setState({horarios:{...state.horarios, [${JSON.stringify(dia)}]:${JSON.stringify(h)}}, horarioPickerDay:null})' style="width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #F0ECE0;background:${sel ? '#E4ECE1' : '#FFFFFF'};text-align:left;">
                    <span style="font-size:13.5px;font-weight:600;color:${sel ? '#2B5D3F' : '#1F2420'};">${h}</span>
                    ${sel ? icon('check', { w: 16, h: 16, stroke: '#2B5D3F', sw: 2.2 }) : ''}
                  </button>`;
                }).join('')}
              </div>` : ''}
            </div>`;
          }).join('')}
        </div>
      </div>` : ''}

      <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px;">
        <div class="row">
          <span style="font-size:13.5px;color:#6B7268;">Total de la semana</span>
          <span style="font-size:18px;font-weight:700;color:${ACCENT};">${weekTotalLabel}</span>
        </div>
        <button onclick="setState({screen:'pago'})" style="width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:${ACCENT};color:#FFFFFF;border-radius:12px;padding:15px;font-size:14.5px;font-weight:700;">Confirmar pedido de la semana</button>
      </div>
    </div>
  `;
}

// ---------------------------------------------------------------------
// Render: Pago / PagoOk
// ---------------------------------------------------------------------
function renderPago() {
  const diasConPedido = computeDiasConPedido();
  const diasConHorario = diasConPedido.filter((d) => d.hasItem);
  const count = diasConHorario.length;
  const weekTotalLabel = computeWeekTotalLabel(diasConPedido);
  const { total: weekTotalNum, complete: weekTotalComplete } = computeWeekTotalNumber(diasConPedido);
  const canPay = weekTotalComplete && weekTotalNum > 0;

  return `
    <div style="display:flex;flex-direction:column;height:100%;">
      <div class="row" style="margin-bottom:22px;">
        <button onclick="setState({screen:'semana'})" style="font-size:15px;color:#2B5D3F;font-weight:500;">Cancelar</button>
        <span style="font-size:16px;font-weight:700;color:#1F2420;">Pagar</span>
        <span style="width:56px;"></span>
      </div>

      <div class="card" style="border-radius:16px;overflow:hidden;margin-bottom:24px;">
        <div style="display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid #F0ECE0;">
          ${icon('leaf', { w: 22, h: 22, stroke: '#2B5D3F', sw: 1.7 })}
          <div style="display:flex;flex-direction:column;gap:1px;">
            <span style="font-size:14px;font-weight:700;color:#1F2420;">ZANO</span>
            <span style="font-size:12px;color:#6B7268;">Pedido semanal · ${count} días</span>
          </div>
        </div>

        ${state.horarioEnabled && diasConHorario.length > 0 ? `
        <div style="padding:14px 16px;border-bottom:1px solid #F0ECE0;display:flex;flex-direction:column;gap:6px;">
          <span style="font-size:11px;font-weight:700;color:#6B7268;text-transform:uppercase;letter-spacing:0.4px;">Horario de recogida</span>
          ${diasConHorario.map((d) => `
            <div class="row">
              <span style="font-size:12.5px;color:#6B7268;">${d.dia}</span>
              <span style="font-size:12.5px;font-weight:600;color:#1F2420;">${esc(state.horarios[d.dia] ?? 'Elige tu horario')}</span>
            </div>
          `).join('')}
        </div>` : ''}

        <div class="row" style="padding:16px;">
          <span style="font-size:14px;font-weight:600;color:#1F2420;">Total</span>
          <span style="font-size:20px;font-weight:700;color:${ACCENT};">${weekTotalLabel}</span>
        </div>
      </div>

      <div style="flex:1;"></div>

      <div style="display:flex;flex-direction:column;align-items:center;gap:14px;padding-bottom:36px;">
        ${state.paymentError ? `
        <div style="display:flex;gap:8px;align-items:flex-start;background:#FBEAE5;border-radius:12px;padding:12px 14px;width:100%;box-sizing:border-box;">
          ${icon('info', { w: 16, h: 16, stroke: '#B4472A', sw: 1.8 })}
          <span style="font-size:12.5px;line-height:1.4;color:#B4472A;">${esc(state.paymentError)}</span>
        </div>` : ''}

        ${!weekTotalComplete ? `
        <div style="display:flex;gap:8px;align-items:flex-start;background:#FBEAE5;border-radius:12px;padding:12px 14px;width:100%;box-sizing:border-box;">
          ${icon('info', { w: 16, h: 16, stroke: '#B4472A', sw: 1.8 })}
          <span style="font-size:12.5px;line-height:1.4;color:#B4472A;">Uno o más platillos de tu semana todavía no tienen precio definido, así que no podemos cobrarte un total exacto. Quítalos desde Mi semana o espera a que se les asigne precio.</span>
        </div>` : !canPay ? `
        <div style="display:flex;gap:8px;align-items:flex-start;background:#FBEAE5;border-radius:12px;padding:12px 14px;width:100%;box-sizing:border-box;">
          ${icon('info', { w: 16, h: 16, stroke: '#B4472A', sw: 1.8 })}
          <span style="font-size:12.5px;line-height:1.4;color:#B4472A;">Agrega al menos un platillo a tu semana para poder pagar.</span>
        </div>` : `
        <div id="paypal-button-container" style="width:100%;"></div>
        <p style="margin:0;font-size:11px;line-height:1.4;color:#9AA096;text-align:center;">Acepta PayPal, tarjeta de crédito y tarjeta de débito — procesado por PayPal, se te cobrará de verdad al confirmar.</p>`}
      </div>
    </div>
  `;
}

function renderPagoOk() {
  const diasConPedido = computeDiasConPedido().filter((d) => d.hasItem);
  return `
    <div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding-top:60px;">
      <div style="width:76px;height:76px;border-radius:999px;background:#2B5D3F;display:flex;align-items:center;justify-content:center;">
        ${icon('check', { w: 34, h: 34, stroke: '#FFFFFF', sw: 2.6 })}
      </div>
      <div>
        <h1 style="margin:0 0 8px 0;font-family:'Fraunces',serif;font-weight:600;font-size:24px;color:#1F2420;">¡Pedido confirmado!</h1>
        <p style="margin:0;font-size:13.5px;line-height:1.5;color:#6B7268;">Tu pedido de la semana quedó pagado. Te esperamos en tu contenedor ZANO.</p>
        ${state.lastPaymentId ? `<p style="margin:6px 0 0 0;font-size:11px;color:#9AA096;">Referencia de pago: ${esc(state.lastPaymentId)}</p>` : ''}
      </div>
      <div style="width:100%;display:flex;flex-direction:column;gap:8px;text-align:left;">
        ${diasConPedido.map((d) => `
          <div class="card row" style="padding:14px;">
            <span style="font-size:12.5px;color:#6B7268;">${d.dia}</span>
            <span style="font-size:13.5px;font-weight:600;color:#1F2420;">${esc(d.label)}</span>
          </div>
        `).join('')}
      </div>
      <button onclick="setState({screen:'inicio', weekOrder:{}, horarios:{}, wholeWeek:false, horarioEnabled:false, paymentError:'', lastPaymentId:null})" class="pill-btn" style="margin-top:8px;">Listo</button>
    </div>
  `;
}

// ---------------------------------------------------------------------
// Render: Perfil
// ---------------------------------------------------------------------
function renderPerfil() {
  // "Pedidos próximos" viene de tu semana armada de verdad; "pedidos pasados"
  // viene de tu historial real guardado en el servidor (ver loadOrderHistory()),
  // sin contar la semana en curso (esa ya se ve en "Pedidos próximos").
  const proximos = computeDiasConPedido().filter((d) => d.hasItem);
  const semanaActual = computeWeekStartISO();
  const pasados = (state.orderHistory || [])
    .filter((h) => h.weekStart !== semanaActual)
    .map((h) => {
      const numComidas = DIAS.filter((d) => h.items && h.items[d]).length;
      const [y, m, d] = h.weekStart.split('-').map(Number);
      const finDeSemana = new Date(y, m - 1, d + 6);
      const yaPaso = new Date() > finDeSemana;
      return {
        semana: 'Semana del ' + fmtWeekLabel(h.weekStart),
        detalle: numComidas + (numComidas === 1 ? ' comida · ' : ' comidas · ') + fmtMoney(h.totalCents),
        estado: yaPaso ? 'Entregado' : 'Confirmado'
      };
    });
  const isProximos = state.historialTab === 'proximos';

  const metodosPago = [
    { label: 'Tarjeta de crédito o débito', detalle: 'Vía PayPal, al momento de pagar' },
    { label: 'PayPal', detalle: 'Con tu cuenta o saldo de PayPal' }
  ];

  const proxima = computeProximaRecoleccion();

  return `
    <div style="display:flex;flex-direction:column;gap:18px;">
      <h1 style="margin:0;font-family:'Fraunces',serif;font-weight:600;font-size:28px;color:#1F2420;">Perfil</h1>

      <button onclick="setState({screen:'perfilInfo'})" style="display:flex;align-items:center;gap:14px;text-align:left;">
        <div style="width:56px;height:56px;border-radius:999px;background:#E4ECE1;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          ${icon('user', { w: 26, h: 26, stroke: '#2B5D3F', sw: 1.7 })}
        </div>
        <div style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;">
          <span style="font-size:16px;font-weight:700;color:#1F2420;">${esc(state.user ? state.user.name : '[Tu nombre]')}</span>
          <span style="font-size:12.5px;color:#6B7268;">${esc(state.user ? state.user.email : '')}${state.plantel ? ' · ' + esc(state.plantel) : ''}</span>
        </div>
        ${icon('chevronRight', { w: 18, h: 18 })}
      </button>

      <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:8px;">
        <span style="font-size:12.5px;color:#6B7268;">Tu próxima recolección</span>
        ${proxima ? `
        <div class="row">
          <div style="display:flex;flex-direction:column;gap:2px;">
            <span style="font-size:16px;font-weight:700;color:#1F2420;">${proxima.dia} · ${esc(state.plantel ?? 'Elige tu institución')}</span>
            <span style="font-size:11.5px;color:#6B7268;">${esc(proxima.item.name)}${state.horarios[proxima.dia] ? ' · ' + esc(state.horarios[proxima.dia]) : ''}</span>
          </div>
          <span style="font-size:11px;font-weight:700;color:#2B5D3F;background:#E4ECE1;border-radius:999px;padding:5px 10px;white-space:nowrap;">${proxima.esHoy ? 'Hoy' : 'Confirmado'}</span>
        </div>` : `
        <span style="font-size:13.5px;color:#6B7268;">Aún no tienes pedidos programados — ve a Mi semana para armar el tuyo.</span>`}
      </div>

      <div>
        <div style="display:flex;background:#F0ECE0;border-radius:999px;padding:4px;gap:4px;margin-bottom:10px;">
          <button onclick="setState({historialTab:'proximos'})" style="flex:1;padding:9px;border-radius:999px;font-size:12.5px;font-weight:700;background:${isProximos ? '#FFFFFF' : 'transparent'};color:${isProximos ? '#1F2420' : '#6B7268'};">Pedidos próximos</button>
          <button onclick="setState({historialTab:'pasados'})" style="flex:1;padding:9px;border-radius:999px;font-size:12.5px;font-weight:700;background:${!isProximos ? '#FFFFFF' : 'transparent'};color:${!isProximos ? '#1F2420' : '#6B7268'};">Pedidos pasados</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${isProximos ? (
            proximos.length > 0 ? proximos.map((d) => `
              <div class="card row" style="padding:14px;">
                <div style="display:flex;flex-direction:column;gap:2px;">
                  <span style="font-size:13.5px;font-weight:600;color:#1F2420;">${d.dia}</span>
                  <span style="font-size:11.5px;color:#6B7268;">${esc(d.label)}</span>
                </div>
                <span style="font-size:11px;font-weight:700;color:#2B5D3F;background:#E4ECE1;border-radius:999px;padding:5px 10px;">${esc(d.price)}</span>
              </div>
            `).join('') : `<p style="margin:0;font-size:12.5px;color:#6B7268;">No tienes pedidos próximos todavía.</p>`
          ) : (
            state.orderHistoryLoading && pasados.length === 0 ? `<p style="margin:0;font-size:12.5px;color:#6B7268;">Cargando…</p>` :
            pasados.length > 0 ? pasados.map((h) => `
              <div class="card row" style="padding:14px;">
                <div style="display:flex;flex-direction:column;gap:2px;">
                  <span style="font-size:13.5px;font-weight:600;color:#1F2420;">${esc(h.semana)}</span>
                  <span style="font-size:11.5px;color:#6B7268;">${esc(h.detalle)}</span>
                </div>
                <span style="font-size:11px;font-weight:700;color:#6B7268;background:#F0ECE0;border-radius:999px;padding:5px 10px;">${esc(h.estado)}</span>
              </div>
            `).join('') : `<p style="margin:0;font-size:12.5px;color:#6B7268;">Todavía no tienes pedidos pasados.</p>`
          )}
        </div>
      </div>

      <div>
        <span style="font-size:14.5px;font-weight:700;color:#1F2420;">Cuenta</span>
        <div class="card" style="display:flex;flex-direction:column;margin-top:10px;overflow:hidden;">
          <button onclick="setState({perfilInstitucionOpen: !state.perfilInstitucionOpen, perfilMetodosOpen:false})" style="width:100%;display:flex;align-items:center;justify-content:space-between;padding:15px 16px;border-bottom:1px solid #F0ECE0;text-align:left;">
            <span style="font-size:14px;font-weight:600;color:#1F2420;">Mi institución</span>
            ${icon(state.perfilInstitucionOpen ? 'chevronDown' : 'chevronRight', { w: 18, h: 18 })}
          </button>
          ${state.perfilInstitucionOpen ? `
          <div style="display:flex;flex-direction:column;">
            ${PLANTELES.map((name) => {
              const sel = state.plantel === name;
              return `<button onclick='setState({plantel:${JSON.stringify(name)}})' style="width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;padding:13px 16px 13px 28px;border-bottom:1px solid #F0ECE0;background:${sel ? '#E4ECE1' : '#FFFFFF'};text-align:left;">
                <span style="font-size:13px;font-weight:600;color:${sel ? '#2B5D3F' : '#1F2420'};">${esc(name)}</span>
                ${sel ? icon('check', { w: 15, h: 15, stroke: '#2B5D3F', sw: 2.2 }) : ''}
              </button>`;
            }).join('')}
          </div>` : ''}

          <button onclick="setState({perfilMetodosOpen: !state.perfilMetodosOpen, perfilInstitucionOpen:false})" style="width:100%;display:flex;align-items:center;justify-content:space-between;padding:15px 16px;border-bottom:1px solid #F0ECE0;text-align:left;">
            <span style="font-size:14px;font-weight:600;color:#1F2420;">Métodos de pago</span>
            ${icon(state.perfilMetodosOpen ? 'chevronDown' : 'chevronRight', { w: 18, h: 18 })}
          </button>
          ${state.perfilMetodosOpen ? `
          <div style="display:flex;flex-direction:column;">
            ${metodosPago.map((m) => `
              <div style="padding:12px 16px 12px 28px;border-bottom:1px solid #F0ECE0;display:flex;flex-direction:column;gap:1px;">
                <span style="font-size:13px;font-weight:600;color:#1F2420;">${esc(m.label)}</span>
                <span style="font-size:11px;color:#6B7268;">${esc(m.detalle)}</span>
              </div>
            `).join('')}
          </div>` : ''}

          <button onclick="setState({ayudaOpen: !state.ayudaOpen, perfilInstitucionOpen:false, perfilMetodosOpen:false, ayudaError:''})" style="width:100%;display:flex;align-items:center;justify-content:space-between;padding:15px 16px;text-align:left;">
            <span style="font-size:14px;font-weight:600;color:#1F2420;">Ayuda</span>
            ${icon(state.ayudaOpen ? 'chevronDown' : 'chevronRight', { w: 18, h: 18 })}
          </button>
          ${state.ayudaOpen ? (
            state.ayudaSent ? `
            <div style="padding:4px 16px 16px;display:flex;flex-direction:column;gap:10px;">
              ${state.ayudaAutomatico ? `
              <p style="margin:0;font-size:11.5px;line-height:1.4;color:#2B5D3F;">Listo — tu mensaje ya se envió automáticamente a <strong>${AYUDA_CORREO}</strong>. No necesitas hacer nada más.</p>
              ` : `
              <p style="margin:0;font-size:11.5px;line-height:1.4;color:#2B5D3F;">Tu mensaje quedó listo para <strong>${AYUDA_CORREO}</strong> y se debió abrir tu app de correo con todo redactado — solo confírmalo ahí. Por si esa app no abrió sola, ya copiamos el mensaje: pégalo en cualquier correo nuevo dirigido a esa dirección.</p>
              <button onclick="copiarTexto(state.ayudaUltimoMensaje)" style="width:100%;box-sizing:border-box;padding:12px;border-radius:12px;font-size:13px;font-weight:700;background:#F0ECE0;color:#1F2420;">Copiar mensaje de nuevo</button>
              `}
              <button onclick="reiniciarAyuda()" style="width:100%;box-sizing:border-box;padding:12px;border-radius:12px;font-size:13px;font-weight:700;background:transparent;color:#6B7268;border:1px solid #D8D3C4;">Escribir otro mensaje</button>
            </div>` : `
            <div style="padding:4px 16px 16px;display:flex;flex-direction:column;gap:10px;">
              <p style="margin:0;font-size:11.5px;line-height:1.4;color:#6B7268;">Escribe tu mensaje — se manda directo a ${AYUDA_CORREO}.</p>
              <textarea id="ayuda-mensaje" placeholder="¿En qué te podemos ayudar?" ${state.ayudaEnviando ? 'disabled' : ''}></textarea>
              ${state.ayudaError ? `<span style="font-size:11.5px;color:#B4472A;">${esc(state.ayudaError)}</span>` : ''}
              <button onclick="enviarAyuda()" ${state.ayudaEnviando ? 'disabled' : ''} style="width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:${ACCENT};color:#FFFFFF;border-radius:12px;padding:13px;font-size:13.5px;font-weight:700;opacity:${state.ayudaEnviando ? '0.6' : '1'};">${state.ayudaEnviando ? 'Enviando…' : 'Enviar por correo'}</button>
            </div>`
          ) : ''}
        </div>
      </div>

      <button onclick="logout()" style="width:100%;text-align:center;padding:14px;font-size:13.5px;font-weight:700;color:#B4472A;">Cerrar sesión</button>
    </div>
  `;
}

// ---------------------------------------------------------------------
// Render: Información de mi perfil (correo, teléfono, contraseña)
// ---------------------------------------------------------------------
function renderPerfilInfo() {
  const user = state.user || { name: '', email: '', phone: '' };
  return `
    <div style="display:flex;flex-direction:column;gap:18px;">
      <button onclick="setState({screen:'perfil'})" style="display:flex;align-items:center;gap:6px;color:#6B7268;font-size:13px;font-weight:600;">
        ${icon('chevronRight', { w: 16, h: 16 }).replace('M9 6l6 6-6 6', 'M15 6l-6 6 6 6')} Volver a Perfil
      </button>

      <div>
        <h1 style="margin:0 0 6px 0;font-family:'Fraunces',serif;font-weight:600;font-size:26px;color:#1F2420;">Información de tu perfil</h1>
        <p style="margin:0;font-size:13px;line-height:1.5;color:#6B7268;">${esc(user.name)}</p>
      </div>

      <div style="display:flex;flex-direction:column;gap:12px;">
        <div style="display:flex;flex-direction:column;gap:6px;">
          <label style="font-size:12.5px;font-weight:600;color:#1F2420;">Correo</label>
          <input id="profile-email" type="email" value="${esc(user.email)}" placeholder="tucorreo@ejemplo.com">
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          <label style="font-size:12.5px;font-weight:600;color:#1F2420;">Número telefónico</label>
          <input id="profile-phone" type="text" value="${esc(user.phone)}" placeholder="81 0000 0000">
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          <label style="font-size:12.5px;font-weight:600;color:#1F2420;">Contraseña</label>
          <input id="profile-password" type="text" value="${esc(REGISTERED_USERS.find((u) => u.email === user.email)?.password ?? '')}" placeholder="Tu contraseña">
        </div>
      </div>

      ${state.profileInfoError ? `
      <div style="display:flex;gap:8px;align-items:flex-start;background:#FBEAE5;border-radius:12px;padding:12px 14px;">
        ${icon('info', { w: 16, h: 16, stroke: '#B4472A', sw: 1.8 })}
        <span style="font-size:12.5px;line-height:1.4;color:#B4472A;">${esc(state.profileInfoError)}</span>
      </div>` : ''}

      <button onclick="savePerfilInfo()" class="pill-btn">Guardar cambios</button>

      <p style="margin:0;font-size:11px;line-height:1.5;color:#9AA096;text-align:center;">Esta es una demo: estos datos solo viven en memoria mientras tengas la pestaña abierta.</p>
    </div>
  `;
}

// ---------------------------------------------------------------------
// Render: Sin conexión — se muestra al abrir la app sin señal, con lo
// último que se guardó en este teléfono (no necesita servidor).
// ---------------------------------------------------------------------
function renderOffline() {
  const semanaActual = computeWeekStartISO();
  const esSemanaVigente = state.offlineWeekStart === semanaActual;
  const proxima = computeProximaRecoleccion();
  const horario = proxima ? (state.horarios[proxima.dia] || null) : null;

  return `
    <div style="display:flex;flex-direction:column;gap:20px;">
      <div style="display:flex;align-items:center;gap:8px;">
        ${icon('leaf', { w: 24, h: 24, stroke: '#2B5D3F', sw: 1.7 })}
        <span style="font-family:'Work Sans',sans-serif;font-size:20px;font-weight:700;letter-spacing:0.5px;color:#2B5D3F;">ZANO</span>
      </div>

      <div style="display:flex;gap:10px;align-items:flex-start;background:#F0ECE0;border-radius:14px;padding:14px;">
        ${icon('wifiOff', { w: 18, h: 18, stroke: '#6B7268', sw: 1.8 })}
        <span style="font-size:12.5px;line-height:1.5;color:#6B7268;">Sin conexión a internet. Esto es lo último que se guardó en este teléfono${esSemanaVigente ? '' : ', de la semana del ' + esc(fmtWeekLabel(state.offlineWeekStart))}.</span>
      </div>

      ${proxima ? `
        <div class="card" style="padding:20px;display:flex;flex-direction:column;gap:6px;">
          <span style="font-size:12.5px;font-weight:700;color:${ACCENT};text-transform:uppercase;letter-spacing:0.3px;">${proxima.esHoy && esSemanaVigente ? 'Tu pedido de hoy' : 'Tu próximo pedido guardado · ' + esc(proxima.dia)}</span>
          <span style="font-family:'Fraunces',serif;font-weight:600;font-size:24px;color:#1F2420;">${esc(proxima.item.name)}</span>
          ${horario ? `
          <div style="display:flex;align-items:center;gap:6px;margin-top:4px;">
            ${icon('clock', { w: 16, h: 16, stroke: '#6B7268', sw: 1.7 })}
            <span style="font-size:13.5px;color:#6B7268;">Hora de entrega: ${esc(horario)}</span>
          </div>` : ''}
          ${state.plantel ? `
          <div style="display:flex;align-items:center;gap:6px;">
            ${icon('pin', { w: 16, h: 16, stroke: '#6B7268', sw: 1.7 })}
            <span style="font-size:13.5px;color:#6B7268;">${esc(state.plantel)}</span>
          </div>` : ''}
        </div>
      ` : `
        <div class="card" style="padding:20px;">
          <span style="font-size:14px;line-height:1.5;color:#6B7268;">No tenemos ningún pedido guardado en este teléfono. En cuanto tengas señal, entra a la app para armar tu semana.</span>
        </div>
      `}

      <button onclick="location.reload()" class="pill-btn">Reintentar conexión</button>
    </div>
  `;
}

// ---------------------------------------------------------------------
// Render principal
// ---------------------------------------------------------------------
function render() {
  const contentEl = document.getElementById('content');
  const navEl = document.getElementById('nav');
  const showNav = state.screen !== 'pago' && state.screen !== 'pagoOk' && state.screen !== 'auth' && state.screen !== 'perfilInfo' && state.screen !== 'forgot' && state.screen !== 'reset' && state.screen !== 'landing' && state.screen !== 'adminLogin' && state.screen !== 'admin' && state.screen !== 'offline' && state.screen !== 'staffLogin' && state.screen !== 'staff';

  let html = '';
  if (state.screen === 'landing') html = renderLanding();
  else if (state.screen === 'auth') html = renderAuth();
  else if (state.screen === 'forgot') html = renderForgot();
  else if (state.screen === 'reset') html = renderReset();
  else if (state.screen === 'adminLogin') html = renderAdminLogin();
  else if (state.screen === 'admin') html = renderAdmin();
  else if (state.screen === 'staffLogin') html = renderStaffLogin();
  else if (state.screen === 'staff') html = renderStaff();
  else if (state.screen === 'offline') html = renderOffline();
  else if (state.screen === 'inicio') html = renderInicio();
  else if (state.screen === 'menu') html = state.selected ? renderMenuDetail() : renderMenuList();
  else if (state.screen === 'semana') html = renderSemana();
  else if (state.screen === 'pago') html = renderPago();
  else if (state.screen === 'pagoOk') html = renderPagoOk();
  else if (state.screen === 'perfil') html = renderPerfil();
  else if (state.screen === 'perfilInfo') html = renderPerfilInfo();

  contentEl.style.bottom = showNav ? 'calc(36px + (env(safe-area-inset-bottom, 0px) * 0.5625))' : '0px';
  contentEl.style.overflowY = state.screen === 'landing' ? 'hidden' : 'auto';
  contentEl.innerHTML = html;
  contentEl.scrollTop = 0;

  // En el celular real, si en ese instante el navegador calcula el alto de
  // la pantalla un poquito más chico o más grande de lo que en realidad
  // es (pasa sobre todo justo después de abrir la app o al agregarla a
  // pantalla de inicio), se alcanza a asomar el fondo de "body" debajo de
  // la barra de navegación. Antes ese espacio se pintaba de crema
  // (#FAF8F3) — se veía como una franja aparte, de otro color, debajo de
  // la barra blanca. Ahora se pinta del mismo blanco que la barra, para
  // que las dos franjas (la barra y lo que se alcance a asomar debajo)
  // sean un solo color.
  document.body.style.background = showNav ? '#FFFFFF' : '';
  document.documentElement.style.background = showNav ? '#FFFFFF' : '';

  if (state.screen === 'pago') {
    const diasConPedido = computeDiasConPedido();
    const { total, complete } = computeWeekTotalNumber(diasConPedido);
    guardarPedidoBackend(total);
    if (complete && total > 0) {
      mountPayPalButton(total);
    }
  }

  // Si entras a Perfil (o a Inicio, donde vive "Pedir lo mismo") y todavía
  // no hemos traído tu historial en esta sesión, lo pedimos una vez.
  if ((state.screen === 'perfil' || state.screen === 'inicio') && state.authToken && !state.orderHistoryLoading && !state.orderHistoryLoaded) {
    loadOrderHistory();
  }

  if (showNav) {
    const isInicio = state.screen === 'inicio';
    const isMenu = state.screen === 'menu';
    const isSemana = state.screen === 'semana';
    const isPerfil = state.screen === 'perfil';
    navEl.style.display = 'flex';
    navEl.innerHTML = `
      <button class="nav-item ${isInicio ? 'active' : ''}" onclick="setState({screen:'inicio'})">
        ${icon('home', { w: 20, h: 20, stroke: 'currentColor', sw: 1.7 })}<span>Inicio</span>
      </button>
      <button class="nav-item ${isMenu ? 'active' : ''}" onclick="setState({screen:'menu', selected:null, pickingDay:null})">
        ${icon('menu', { w: 20, h: 20, stroke: 'currentColor', sw: 1.7 })}<span>Menú</span>
      </button>
      <button class="nav-item ${isSemana ? 'active' : ''}" onclick="setState({screen:'semana'})">
        ${icon('week', { w: 20, h: 20, stroke: 'currentColor', sw: 1.7 })}<span>Mi semana</span>
      </button>
      <button class="nav-item ${isPerfil ? 'active' : ''}" onclick="setState({screen:'perfil'})">
        ${icon('user', { w: 20, h: 20, stroke: 'currentColor', sw: 1.7 })}<span>Perfil</span>
      </button>
    `;
    navEl.querySelectorAll('.nav-item').forEach((el) => { el.style.color = el.classList.contains('active') ? '#2B5D3F' : '#9AA096'; });
  } else {
    navEl.style.display = 'none';
  }
}

// Guarda una copia de la app en este teléfono la primera vez que se abre
// con internet, para que el navegador pueda volver a ABRIRLA sin señal
// (ver sw.js) — sin esto, sin conexión no se llega ni a ejecutar el JS
// que muestra el pedido guardado.
//
// "updateViaCache: 'none'" es importante: sin esto, el propio navegador
// puede guardar una copia vieja de sw.js y nunca darse cuenta de que
// cambió (aunque cambiemos el número de versión adentro), así que la app
// se queda viendo diseños viejos para siempre aunque subamos código
// nuevo. Y en cuanto el navegador SÍ detecta una versión nueva de sw.js y
// la activa, recargamos la página una sola vez automáticamente — así el
// usuario ve el cambio de una vez, sin tener que cerrar y volver a abrir
// la app a mano.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
      .then((reg) => reg.update())
      .catch(() => { /* navegadores viejos o sin soporte: la app sigue funcionando normal con internet */ });
  });
  let yaSeRecargoPorActualizacion = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (yaSeRecargoPorActualizacion) return;
    yaSeRecargoPorActualizacion = true;
    window.location.reload();
  });
}

// ---------------------------------------------------------------------
// Arranque: recupera la sesión guardada en este teléfono (para no pedir
// iniciar sesión cada vez que se abre la app) y, si no hay señal en ese
// momento, muestra la pantalla de "Sin conexión" con el último pedido
// guardado en vez de intentar hablar con el servidor.
// ---------------------------------------------------------------------
const savedSession = loadSession();
if (savedSession && savedSession.user) {
  state = {
    ...state,
    screen: 'inicio',
    user: savedSession.user,
    authToken: savedSession.authToken || '',
    plantel: savedSession.plantel || null
  };
}

if (!navigator.onLine) {
  const cache = loadOfflineSnapshot();
  if (cache) {
    state = {
      ...state,
      weekOrder: cache.weekOrder || {},
      horarios: cache.horarios || {},
      plantel: state.plantel || cache.plantel || null,
      offlineWeekStart: cache.weekStart || null,
      screen: 'offline'
    };
  } else if (state.user) {
    // Hay sesión guardada pero todavía ningún pedido cacheado en este
    // teléfono: igual mostramos la pantalla de sin conexión (con su
    // propio mensaje) en vez de mandarlo a pantallas que necesitan servidor.
    state = { ...state, screen: 'offline' };
  }
  // Si no hay sesión ni pedido guardado, no hay nada que mostrar sin
  // conexión: se queda en la pantalla de inicio (landing) normal.
}

// Si este dispositivo ya había entrado antes al panel de administración o
// al de cocina, regresa directo ahí (en vez de la pantalla de login de
// cliente) — cada quien mantiene su propia sesión guardada por separado.
const savedAdminToken = loadAdminSession();
const savedStaffToken = loadStaffSession();
if (savedStaffToken) {
  state = { ...state, screen: 'staff', staffToken: savedStaffToken };
}
if (savedAdminToken) {
  state = { ...state, screen: 'admin', adminToken: savedAdminToken };
}

// Entra directo al panel de administración cuando abres tudominio.com/#admin
// (nunca aparece en la navegación normal de la app, es solo para ti), o al
// panel de cocina con tudominio.com/#staff (para el personal). Esto manda
// sobre lo de arriba: si escribes la dirección a propósito, así te muestra
// el login de ese panel aunque ya hubiera una sesión guardada de otro tipo.
if (location.hash === '#admin') {
  state = { ...state, screen: 'adminLogin' };
} else if (location.hash === '#staff') {
  state = { ...state, screen: 'staffLogin' };
}

render();

// Si arrancamos ya con sesión de administrador o de cocina, carga los
// datos de una vez (igual que pasa justo después de meter la contraseña).
if (state.screen === 'admin' && state.adminToken) loadAdminData();
if (state.screen === 'staff' && state.staffToken) loadStaffData();
if (state.screen === 'inicio' && state.authToken) loadOrderHistory();

// Si la app se quedó en la pantalla de "Sin conexión" y vuelve la señal,
// regresa sola a la app normal (inicio si ya había sesión, o landing).
window.addEventListener('online', () => {
  if (state.screen === 'offline') {
    setState({ screen: state.user ? 'inicio' : 'landing' });
  }
});
</script>
</body>
</html>
