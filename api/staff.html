<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FAF8F3">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<!--
  Igual que admin.html: esta página tiene su PROPIO manifest escrito aquí
  mismo desde el primer momento (no se cambia con JavaScript después),
  para que "Agregar a pantalla de inicio" lo lea bien siempre. Por eso es
  la página que hay que abrir para agregar el ícono de Cocina, en vez de
  abrir zano-five.vercel.app/#staff directamente.

  IMPORTANTE: igual que en admin.html, esta página YA NO se redirige
  sola de inmediato. La redirección solo ocurre cuando ya se abrió
  instalada como ícono (modo standalone) — mientras el usuario la ve
  dentro de Safari para agregarla, se queda quieta en esta misma URL.
-->
<link rel="manifest" href="/manifest-staff.json">
<title>ZANO Cocina</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #FAF8F3;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #2B2B26;
  }
  .wrap {
    box-sizing: border-box;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 28px;
    gap: 10px;
  }
  h1 { font-size: 19px; margin: 0 0 4px; }
  p { font-size: 14.5px; line-height: 1.5; color: #6B6B60; margin: 0; max-width: 320px; }
  .badge {
    width: 56px; height: 56px; border-radius: 14px;
    background: #2E5339; color: #fff; display: flex; align-items: center;
    justify-content: center; font-weight: 700; font-size: 20px; margin-bottom: 6px;
  }
</style>
<script>
  var esStandalone = (window.navigator.standalone === true) ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (esStandalone) {
    location.replace('/#staff');
  }
</script>
</head>
<body>
  <div class="wrap">
    <div class="badge">Z</div>
    <h1>Cocina — ZANO</h1>
    <p>Para instalar el ícono, toca el botón de Compartir de Safari y luego "Agregar a pantalla de inicio" desde esta misma página.</p>
  </div>
</body>
</html>
